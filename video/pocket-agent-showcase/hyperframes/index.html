<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
      }
      .transition-sweep {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        background: #4a9dff;
        transform: scaleX(0);
        transform-origin: left center;
        opacity: 0;
      }
      .transition-sweep::after {
        content: "";
        position: absolute;
        inset: 0;
        background: #000000;
        transform: translateX(14px);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="pocket-agent-showcase-abstract"
      data-start="0"
      data-duration="45"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="signal"
        class="clip"
        data-composition-id="signal"
        data-composition-src="compositions/signal.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="architecture"
        class="clip"
        data-composition-id="architecture"
        data-composition-src="compositions/architecture.html"
        data-start="4"
        data-duration="6"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="phone-demo"
        class="clip"
        data-composition-id="phone-demo"
        data-composition-src="compositions/phone-demo.html"
        data-start="10"
        data-duration="12"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="pillars"
        class="clip"
        data-composition-id="pillars"
        data-composition-src="compositions/pillars.html"
        data-start="22"
        data-duration="7"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="resilient-local"
        class="clip"
        data-composition-id="resilient-local"
        data-composition-src="compositions/resilient.html"
        data-start="29"
        data-duration="9"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="resolve"
        class="clip"
        data-composition-id="resolve"
        data-composition-src="compositions/resolve.html"
        data-start="38"
        data-duration="7"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="transition-1" class="transition-sweep clip" data-start="3.6" data-duration="0.5" data-track-index="20"></div>
      <div id="transition-2" class="transition-sweep clip" data-start="9.6" data-duration="0.5" data-track-index="21"></div>
      <div id="transition-3" class="transition-sweep clip" data-start="21.6" data-duration="0.5" data-track-index="22"></div>
      <div id="transition-4" class="transition-sweep clip" data-start="28.6" data-duration="0.5" data-track-index="23"></div>
      <div id="transition-5" class="transition-sweep clip" data-start="37.6" data-duration="0.5" data-track-index="24"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      [3.6, 9.6, 21.6, 28.6, 37.6].forEach((time, index) => {
        const selector = `#transition-${index + 1}`;
        tl.fromTo(selector, {opacity: 0, scaleX: 0, transformOrigin: "left center"}, {opacity: 1, scaleX: 1, duration: 0.18, ease: "expo.in"}, time);
        tl.to(selector, {opacity: 0, scaleX: 0, transformOrigin: "right center", duration: 0.24, ease: "expo.out"}, time + 0.18);
      });
      window.__timelines["pocket-agent-showcase-abstract"] = tl;
    </script>
  </body>
</html>
