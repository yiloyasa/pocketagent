<template id="signal-template">
  <div data-composition-id="signal" data-width="1080" data-height="1920">
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: local("Arial Narrow"), local("Bahnschrift Condensed"), local("Segoe UI");
        font-weight: 800 900;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: local("Cascadia Mono"), local("Consolas"), local("Segoe UI Mono");
        font-weight: 400 600;
      }
      [data-composition-id="signal"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #f2f2f4;
        font-family: "IBM Plex Mono", monospace;
      }
      [data-composition-id="signal"] .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 116px 82px;
        gap: 38px;
        box-sizing: border-box;
      }
      [data-composition-id="signal"] .orb {
        position: absolute;
        width: 560px;
        height: 560px;
        border-radius: 50%;
        background: rgba(74, 157, 255, 0.12);
        filter: blur(34px);
      }
      [data-composition-id="signal"] .orb-a { top: -180px; right: -180px; }
      [data-composition-id="signal"] .orb-b { bottom: -240px; left: -220px; background: rgba(181, 132, 255, 0.08); }
      [data-composition-id="signal"] .eyebrow {
        color: #4a9dff;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      [data-composition-id="signal"] h1 {
        max-width: 920px;
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-size: 152px;
        line-height: 0.86;
        letter-spacing: -0.05em;
      }
      [data-composition-id="signal"] h1 span { display: block; }
      [data-composition-id="signal"] .copy {
        max-width: 760px;
        color: #98989f;
        font-size: 22px;
        line-height: 1.55;
      }
      [data-composition-id="signal"] .trace {
        position: absolute;
        width: 860px;
        height: 2px;
        right: -160px;
        top: 580px;
        background: #303036;
        transform: rotate(-22deg);
        transform-origin: right center;
      }
      [data-composition-id="signal"] .trace-beacon {
        position: absolute;
        left: 0;
        top: -2px;
        width: 210px;
        height: 6px;
        border-radius: 20px;
        background: #4a9dff;
        box-shadow: 0 0 26px #4a9dff;
      }
      [data-composition-id="signal"] .trace.secondary {
        top: 720px;
        right: 180px;
        width: 520px;
        opacity: 0.44;
        transform: rotate(24deg);
      }
      [data-composition-id="signal"] .pill {
        display: inline-flex;
        width: fit-content;
        padding: 12px 18px;
        border: 1px solid #303036;
        border-radius: 999px;
        color: #98989f;
        font-size: 18px;
        letter-spacing: 0.06em;
      }
    </style>
    <div class="orb orb-a" data-layout-ignore></div>
    <div class="orb orb-b" data-layout-ignore></div>
    <div class="trace" data-layout-ignore><span class="trace-beacon" data-layout-ignore></span></div>
    <div class="trace secondary" data-layout-ignore><span class="trace-beacon" data-layout-ignore></span></div>
    <div class="scene-content">
      <div id="signal-eyebrow" class="eyebrow">POCKETAGENT / LOCAL-FIRST AGENT CONTROL</div>
      <h1 id="signal-title"><span>Your agent.</span><span>In your pocket.</span></h1>
      <div id="signal-copy" class="copy">从手机发出一个意图，让电脑上的 Agent 完成真正的工作。</div>
      <div id="signal-pill" class="pill">NO CLOUD RELAY</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      tl.from("#signal-eyebrow", {opacity: 0, x: -48, duration: 0.4, ease: "power4.out"}, 0.16);
      tl.from("#signal-title span", {opacity: 0, y: 84, rotation: 2, duration: 0.7, stagger: 0.12, ease: "expo.out"}, 0.28);
      tl.from("#signal-copy", {opacity: 0, y: 32, duration: 0.48, ease: "sine.out"}, 0.78);
      tl.from("#signal-pill", {opacity: 0, scale: 0.8, duration: 0.38, ease: "back.out(1.8)"}, 1.1);
      tl.to(".trace-beacon", {x: 500, duration: 1.6, ease: "power2.inOut"}, 0.2);
      tl.to(".orb-a", {scale: 1.08, opacity: 0.64, duration: 1.8, ease: "sine.inOut", repeat: 2, yoyo: true}, 0.2);
      tl.to(".orb-b", {scale: 1.1, opacity: 0.55, duration: 2.2, ease: "sine.inOut", repeat: 2, yoyo: true}, 0.4);
      window.__timelines["signal"] = tl;
    </script>
  </div>
</template>
