        color: #98989f;

        background: #151517;

      [data-composition-id="phone-demo"] .phone-card::before {

        inset: 18px;
        border-radius: 44px;
        border: 1px solid #2a2a2e;

        left: 76px;
        right: 76px;

        border-radius: 18px;
        color: #98989f;
