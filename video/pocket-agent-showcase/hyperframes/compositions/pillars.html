<template id="pillars-template">
  <div
    data-composition-id="pillars"
    data-width="1080"
    data-height="1920"
  >
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: local("Arial Narrow"), local("Bahnschrift Condensed"), local("Segoe UI");
        font-weight: 800 900;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: local("Cascadia Mono"), local("Consolas"), local("Segoe UI Mono");
        font-weight: 400 600;
      }
      [data-composition-id="pillars"] {
        width: 100%;
        height: 100%;
        background: #000000;
        color: #f2f2f4;
        font-family: "IBM Plex Mono", monospace;
        overflow: hidden;
      }
      [data-composition-id="pillars"] .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 114px 82px;
        gap: 46px;
        box-sizing: border-box;
      }
      [data-composition-id="pillars"] .eyebrow {
        color: #b584ff;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      [data-composition-id="pillars"] h2 {
        max-width: 720px;
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 110px;
        line-height: 0.9;
        letter-spacing: -0.04em;
      }
      [data-composition-id="pillars"] .bars {
        height: 720px;
        display: flex;
        align-items: end;
        gap: 18px;
        padding: 34px 24px 0;
        border-left: 1px solid #303036;
        border-bottom: 1px solid #303036;
      }
      [data-composition-id="pillars"] .bar-wrap {
        display: flex;
        flex: 1;
        height: 100%;
        flex-direction: column;
        justify-content: end;
        gap: 18px;
      }
      [data-composition-id="pillars"] .bar {
        transform-origin: bottom center;
        border-radius: 16px 16px 4px 4px;
        background: #4a9dff;
        box-shadow: 0 0 38px rgba(74, 157, 255, 0.22);
      }
      [data-composition-id="pillars"] .bar-wrap:nth-child(2) .bar { background: #6aaeff; }
      [data-composition-id="pillars"] .bar-wrap:nth-child(3) .bar { background: #8abfff; }
      [data-composition-id="pillars"] .bar-wrap:nth-child(4) .bar { background: #32d74b; }
      [data-composition-id="pillars"] .bar-wrap:nth-child(5) .bar { background: #b584ff; }
      [data-composition-id="pillars"] .label {
        color: #98989f;
        font-size: 16px;
        letter-spacing: 0.04em;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }
      [data-composition-id="pillars"] .note {
        color: #98989f;
        font-size: 20px;
      }
    </style>
    <div class="scene-content">
      <div id="pillars-eyebrow" class="eyebrow">CAPABILITY MAP / FIVE PILLARS</div>
      <h2 id="pillars-title">一台手机，五种工作流。</h2>
      <div id="pillars-bars" class="bars">
        <div class="bar-wrap"><div id="pillar-chat" class="bar" style="height: 94%"></div><div class="label">CHAT</div></div>
        <div class="bar-wrap"><div id="pillar-terminal" class="bar" style="height: 78%"></div><div class="label">TERMINAL</div></div>
        <div class="bar-wrap"><div id="pillar-files" class="bar" style="height: 68%"></div><div class="label">FILES</div></div>
        <div class="bar-wrap"><div id="pillar-git" class="bar" style="height: 58%"></div><div class="label">GIT</div></div>
        <div class="bar-wrap"><div id="pillar-tasks" class="bar" style="height: 48%"></div><div class="label">TASKS</div></div>
      </div>
      <div id="pillars-note" class="note">chat · terminal · files · git · tasks</div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      tl.from("#pillars-eyebrow", {opacity: 0, x: -42, duration: 0.44, ease: "power4.out"}, 0.16);
      tl.from("#pillars-title", {opacity: 0, y: 76, duration: 0.72, ease: "expo.out"}, 0.28);
      tl.from("#pillars-bars", {opacity: 0, scaleY: 0.78, transformOrigin: "bottom center", duration: 0.54, ease: "power2.out"}, 0.78);
      tl.from("#pillar-chat", {scaleY: 0, duration: 0.56, ease: "back.out(1.5)"}, 1.08);
      tl.from("#pillar-terminal", {scaleY: 0, duration: 0.48, ease: "power3.out"}, 1.18);
      tl.from("#pillar-files", {scaleY: 0, duration: 0.45, ease: "sine.out"}, 1.28);
      tl.from("#pillar-git", {scaleY: 0, duration: 0.42, ease: "power2.out"}, 1.38);
      tl.from("#pillar-tasks", {scaleY: 0, duration: 0.4, ease: "expo.out"}, 1.48);
      tl.from("#pillars-note", {opacity: 0, x: -24, duration: 0.55, ease: "sine.out"}, 1.72);
      window.__timelines["pillars"] = tl;
    </script>
  </div>
</template>
