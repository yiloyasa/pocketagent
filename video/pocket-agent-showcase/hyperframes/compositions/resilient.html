<template id="resilient-template">
  <div data-composition-id="resilient-local" data-width="1080" data-height="1920">
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        src: local("Arial Narrow"), local("Bahnschrift Condensed"), local("Segoe UI");
        font-weight: 800 900;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: local("Cascadia Mono"), local("Consolas"), local("Segoe UI Mono");
        font-weight: 400 600;
      }
      [data-composition-id="resilient-local"] {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        color: #f2f2f4;
        font-family: "IBM Plex Mono", monospace;
      }
      [data-composition-id="resilient-local"] .scene-content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 116px 82px;
        gap: 38px;
        box-sizing: border-box;
      }
      [data-composition-id="resilient-local"] .orb {
        position: absolute;
        width: 560px;
        height: 560px;
        bottom: -240px;
        left: -220px;
        border-radius: 50%;
        background: rgba(181, 132, 255, 0.08);
        filter: blur(34px);
      }
      [data-composition-id="resilient-local"] .eyebrow {
        color: #4a9dff;
        font-size: 20px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      [data-composition-id="resilient-local"] h2 {
        max-width: 820px;
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 900;
        font-size: 118px;
        line-height: 0.88;
        letter-spacing: -0.05em;
      }
      [data-composition-id="resilient-local"] .copy {
        max-width: 820px;
        color: #98989f;
        font-size: 22px;
        line-height: 1.55;
      }
      [data-composition-id="resilient-local"] .network {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        width: 100%;
        max-width: 920px;
      }
      [data-composition-id="resilient-local"] .network-card {
        display: flex;
        align-items: center;
        gap: 18px;
        min-height: 124px;
        padding: 24px;
        border: 1px solid #303036;
        border-radius: 26px;
        background: #151517;
      }
      [data-composition-id="resilient-local"] .network-dot {
        width: 18px;
        height: 18px;
        flex: none;
        border-radius: 50%;
        background: #32d74b;
        box-shadow: 0 0 22px rgba(50,215,75,0.5);
      }
      [data-composition-id="resilient-local"] .network-card span { color: #98989f; font-size: 18px; }
      [data-composition-id="resilient-local"] .network-card strong { display: block; color: #f2f2f4; font-size: 25px; margin-bottom: 5px; }
    </style>
    <div class="orb" data-layout-ignore></div>
    <div class="scene-content">
      <div id="resilient-eyebrow" class="eyebrow">CONNECTED / RESILIENT / LOCAL</div>
      <h2 id="resilient-title">连接断开，工作不必停止。</h2>
      <div id="resilient-copy" class="copy">USB、局域网和事件续传，把控制权留在你自己的设备之间。</div>
      <div id="resilient-network" class="network">
        <div class="network-card"><div class="network-dot"></div><div><strong>USB reverse</strong><span>direct device path</span></div></div>
        <div class="network-card"><div class="network-dot"></div><div><strong>LAN discovery</strong><span>local network fallback</span></div></div>
        <div class="network-card"><div class="network-dot"></div><div><strong>Event resume</strong><span>replay after reconnect</span></div></div>
        <div class="network-card"><div class="network-dot"></div><div><strong>Approval recovery</strong><span>continue with context</span></div></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({paused: true});
      tl.from("#resilient-eyebrow", {opacity: 0, x: -44, duration: 0.42, ease: "power4.out"}, 0.16);
      tl.from("#resilient-title", {opacity: 0, y: 72, duration: 0.68, ease: "expo.out"}, 0.28);
      tl.from("#resilient-copy", {opacity: 0, y: 28, duration: 0.46, ease: "sine.out"}, 0.7);
      tl.from(".network-card", {opacity: 0, y: 46, scale: 0.94, duration: 0.5, stagger: 0.1, ease: "back.out(1.3)"}, 1.1);
      window.__timelines["resilient-local"] = tl;
    </script>
  </div>
</template>
