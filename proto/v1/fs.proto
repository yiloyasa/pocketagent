syntax = "proto3";

package pocketagent.v1;

import "v1/common.proto";

option java_multiple_files = true;

option go_package = "github.com/pocketagent/daemon/internal/gen/pocketagent/v1;pocketagentv1";

// ============ 文件系统服务(原作叫 EnvironmentService)============

service FileSystemService {
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  // "此电脑":返回所有盘符/挂载点
  rpc ListRoots(ListRootsRequest) returns (ListRootsResponse);
  // 大文件分块流
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse); // 整写(带乐观锁,返回新修改时间)
  rpc ReadFileDiff(ReadFileDiffRequest) returns (FileDiff); // 未保存改动 vs git HEAD
  rpc CreateDirectory(CreateDirectoryRequest) returns (Empty);
  rpc DeleteEntry(DeleteEntryRequest) returns (Empty);
  rpc MoveEntry(MoveEntryRequest) returns (Empty);
  // 内容搜索(内置 ripgrep 语义,子串或正则)
  rpc SearchContent(SearchContentRequest) returns (stream SearchMatch);
}

message ListRootsRequest {}
message ListRootsResponse {
  repeated DirectoryEntry roots = 1;
}

message ListDirectoryRequest {
  string path = 1;
  bool include_hidden = 2;
}
message ListDirectoryResponse {
  repeated DirectoryEntry entries = 1;
}
message DirectoryEntry {
  string name = 1;
  string path = 2;      // 绝对路径
  bool is_dir = 3;
  int64 size_bytes = 4;
  int64 modified_unix_ms = 5;
}

message ReadFileRequest {
  string path = 1;
  int64 max_bytes = 2;  // 0 = 服务端默认上限(如 2MB),超出报错
}
message FileChunk {
  bytes data = 1;
  int64 total_size = 2; // 仅首块携带
  bool text = 3;        // UTF-8 文本可直显,否则当二进制
  // 【乐观锁配套】该文件读取时刻的修改时间(UnixMilli)。每个分块都带同一值,
  // 客户端取任意一块即可拿到;手机端编辑保存时回填 WriteFileRequest 的
  // expected_modified_at_ms。目录/不存在语义照旧(不读文件就没有该值)。
  int64 modified_unix_ms = 4;
}

message WriteFileRequest {
  string path = 1;
  bytes data = 2;
  bool create = 3;   // 不存在则创建
  bool truncate = 4; // 覆盖写
  // 【乐观锁】调用方读文件时记下的修改时间(UnixMilli)。大于 0 时服务端校验:
  // 与磁盘当前值不等(含文件已被删)则拒绝写入,防止手机与电脑并行编辑互相覆盖。
  // 0 / 缺省 = 不校验(兼容旧客户端与"强制覆盖"场景)。对齐原作 WriteWorkspaceTextFile。
  int64 expected_modified_at_ms = 5;
}

message WriteFileResponse {
  // 写入完成后磁盘上的新修改时间(UnixMilli)。客户端保存它,作为下一次
  // 乐观锁写入的 expected_modified_at_ms。读取失败时为 0。
  int64 new_modified_at_ms = 1;
}

message ReadFileDiffRequest { string path = 1; }
message FileDiff {
  string unified_diff = 1;  // git diff 格式
  bool has_changes = 2;
}

message CreateDirectoryRequest { string path = 1; }

message DeleteEntryRequest {
  string path = 1;
  bool recursive = 2;
}

message MoveEntryRequest {
  string from_path = 1;
  string to_path = 2;
}

message SearchContentRequest {
  string root = 1;
  string query = 2;
  bool regex = 3;
  string glob = 4;      // 文件名过滤,如 "*.go"
  int32 max_results = 5; // 0 = 服务端默认(200)
}
message SearchMatch {
  string path = 1;
  int32 line_number = 2;
  string line_text = 3;
}
