syntax = "proto3";

package pocketagent.v1;

option java_multiple_files = true;

option go_package = "github.com/pocketagent/daemon/internal/gen/pocketagent/v1;pocketagentv1";

import "v1/common.proto";

// ============ 会话(Thread)服务:聊天 + agent 执行 ============

service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (Thread);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (Thread);
  rpc DeleteThread(DeleteThreadRequest) returns (Empty);
  rpc ArchiveThread(ArchiveThreadRequest) returns (Thread);
  rpc RenameThread(RenameThreadRequest) returns (Thread);
  rpc SetThreadGoal(SetThreadGoalRequest) returns (Thread); // 常驻目标/上下文说明
  rpc CompactThread(CompactThreadRequest) returns (Empty);  // 历史压缩,省 token

  // 核心:执行一轮 agent。客户端 → 服务端:用户输入/中途补充/审批应答;
  // 服务端 → 客户端:文本增量/工具调用/审批请求/turn 结束。
  rpc StartTurn(stream TurnClientMessage) returns (stream TurnServerMessage);

  rpc CancelTurn(CancelTurnRequest) returns (Empty);
  // 撤回该会话在上游排队中的全部输入(0.87.1 pi clear_queue 接线,只增)。
  // 等价 pi TUI 里按 Esc:清空的是 pi 子进程内存里的原生队列(steer/followUp),
  // 不是 daemon 侧的续跑队列(那归 CancelTurn/轮次收尾管)。仅 pi 会话支持。
  rpc ClearQueuedInputs(ClearQueuedInputsRequest) returns (ClearQueuedInputsResponse);
  // Reconnect-safe approval delivery; request_id must still be pending.
  rpc SubmitApproval(SubmitApprovalRequest) returns (Empty);

  // 历史消息(打开旧会话时拉取)
  rpc GetThreadHistory(GetThreadHistoryRequest) returns (GetThreadHistoryResponse);

  // ---- 会话内消息内容搜索(只增)----
  // 在一个会话的历史消息正文里搜一段文字(大小写不敏感),命中项带前后文
  // 摘要(snippet)。手机端历史导航浮层目前只能按标题/摘要过滤本地已加载的
  // 列表;daemon 内存 store 里有**全量**消息(含未随 limit 下发的更早内容),
  // 这个 RPC 让"搜历史聊过什么"不需要把整条会话拖到手机上再翻。
  // 鉴权走既有 UnaryAuth 通道(与 GetThreadHistory 同级),无新增配置。
  rpc SearchThreadMessages(SearchThreadMessagesRequest) returns (SearchThreadMessagesResponse);

  // ---- P1-5 事件断点续传(只增)----
  // 按 seq 增量回放某线程的事件帧(seq > after_sequence,升序),回放完即关流,
  // 不做 live 跟随。手机断线重连后用它把错过的帧无缝补上,替代"整屏历史回填"。
  // 若 after_sequence 已超出 daemon 的保留窗口(events.jsonl 轮转丢弃),
  // 流里只会有一帧 ResyncRequired —— 手机端收到后必须退回 GetThreadHistory 全量回填。
  rpc GetThreadEventsSince(GetThreadEventsSinceRequest) returns (stream TurnServerMessage);

  // 电脑上 codex 已有的会话:列出 + 导入(绑定为本地线程,可继续聊)
  rpc ListCodexThreads(ListCodexThreadsRequest) returns (ListCodexThreadsResponse);
  rpc ImportCodexThread(ImportCodexThreadRequest) returns (ImportCodexThreadResponse);

  // 电脑上其它桌面 agent(pi / zcode)已有的会话:列出 + 导入(绑定为本地线程,可继续聊)。
  // 【为什么是一对通用 RPC 而不是两对】pi / zcode 的差异只在"列表来源"与
  // "外部会话引用怎么填",协议面完全同构 —— agent_id 一个参数就能区分,
  // 开两套 RPC 只会让手机端多写一遍一模一样的接线。codex 不并入:它有
  // app-server 标题同步 / rollout 删除等专属逻辑,保持原样不动。
  rpc ListAgentThreads(ListAgentThreadsRequest) returns (ListAgentThreadsResponse);
  rpc ImportAgentThread(ImportAgentThreadRequest) returns (ImportAgentThreadResponse);

  // ---- 会话组织:分组 / 分支 / 回滚 ----
  // 【为什么 fork 和 rollback 必须二次确认】两者都会改变"这个会话之后是什么" ——
  // fork 会分出一条新会话,rollback 会直接丢掉最近 N 个回合。手机上误触的代价比
  // 电脑上高得多(屏幕小、手指滑一下就点到),所以 App 侧必须弹确认再调。
  rpc ForkThread(ForkThreadRequest) returns (Thread);
  rpc RollbackThread(RollbackThreadRequest) returns (Thread);

  rpc ListThreadSections(ListThreadSectionsRequest) returns (ListThreadSectionsResponse);
  rpc CreateThreadSection(CreateThreadSectionRequest) returns (ThreadSection);
  rpc RenameThreadSection(RenameThreadSectionRequest) returns (ThreadSection);
  rpc DeleteThreadSection(DeleteThreadSectionRequest) returns (Empty);
  rpc MoveThreadToSection(MoveThreadToSectionRequest) returns (Thread);

  // 审查者(guardian/自动审查)拒绝之后,用户推翻它的结论并要求继续执行。
  // 手机端不提供这个按钮的话,用户看到的就是"任务莫名其妙失败了"。
  rpc ApproveGuardianDeniedAction(ApproveGuardianDeniedActionRequest) returns (Empty);

  // ---- 会话导出:离线 HTML 存档(只增)----
  // 把整棵会话渲染成离线 HTML 落盘在电脑上(目前由 pi 侧 export_html 能力提供,
  // 文件固定写在会话工作区的 .pocketagent-exports/<threadId>.html)。返回电脑上的
  // 绝对路径,手机端用现有 ReadFile(FileChunk 流)下载链路取文件、浏览器离线打开。
  // 与"导出对话(Markdown)"互补:Markdown 只导出手机选中的正文,HTML 是电脑端
  // 的完整会话存档(含思考/工具过程)。非 pi 会话 / 未落地 / 导出失败一律走
  // gRPC 错误(人话),手机端 Toast 降级,不炸 UI。
  rpc ExportThreadHtml(ExportThreadHtmlRequest) returns (ExportThreadHtmlResponse);

  // ---- 对话栏提示词优化(只增)----
  // 手机输入栏的一键改写:把用户的原始输入交给电脑端 ZCode 的文本生成能力
  // (app-server 的 workspace/generateText,复用桌面端已登录凭据,零新增配置)
  // 改写成"给 AI 编程代理的清晰指令"。纯文本进、纯文本出:不建会话、不落库、
  // 不影响任何线程状态;失败走 gRPC 错误(人话),手机端 Toast 降级,不炸 UI。
  rpc OptimizePrompt(OptimizePromptRequest) returns (OptimizePromptResponse);

  // ---- zcode 会话的斜杠命令面板(只增)----
  // 手机输入栏以 "/" 开头且会话是 zcode 时,输入框上方弹命令候选条;候选数据
  // 来自 daemon 侧该线程归属 zcode 会话的快照(slashCommands[],来源 ZCode
  // app-server 的 session/create|resume 应答)。非 zcode 会话 / 拉取失败一律回
  // **空列表**(这不是错误:手机端按"没有命令面板"处理,绝不 Toast 报错)。
  rpc ListSlashCommands(ListSlashCommandsRequest) returns (ListSlashCommandsResponse);

  // ---- /计划:发起计划审查(只增)----
  // 手机端斜杠面板的内置伪命令"/计划"的落点:让电脑端 codex 对当前会话拟定的
  // 计划发起一轮审查(codex review/start,实测 fire-and-return —— 应答里
  // turn.status=inProgress 即回,审查产出以 item/* 事件流回**原会话**,手机端
  // 现有的事件时间线直接可见)。仅 codex 会话支持;其他 agent / 未落地会话
  // 回 gRPC 错误(人话),手机端 Toast 降级,不炸 UI。
  rpc StartReview(StartReviewRequest) returns (StartReviewResponse);

  // ---- 跨 agent 委派:T-L2fix 单写者重构(只增)----
  // -collab-mcp 子模式(本机 MCP 代理进程,经 pi-mcp-adapter 等拉起)的薄代理
  // 落点:代理进程收到 agent_delegate 工具调用后,经本机回环 gRPC
  // (127.0.0.1:7246,TLS + Bearer token)调本 RPC,把委派汇入主 daemon 的
  // 单一委派引擎实例(collab_delegate.go)。
  // 【为什么收归主 daemon 单实例】子模式不再自持 FileStore/providers/引擎:
  //   1. 消灭写冲突 —— 子代理进程不再触碰 threads.json/events.jsonl,主
  //      daemon 是唯一写者(子线程、事件 seq 不再被双进程互相抹掉/污染);
  //   2. 深度锁跨进程成立 —— 所有代理进程的委派汇入同一引擎,childThreads
  //      登记簿与在飞深度计数成为全局真值,"子不生子"不再被跨进程击穿
  //      (子 pi 再拉起的代理进程同样汇入)。
  // 鉴权:走既有鉴权拦截器(UnaryAuth → authorized),已配对设备的
  // Bearer token(含 legacy 单 token)才可委派。
  // 错误语义:业务失败(agent 不存在/深度拒绝/轮次失败等)走应答的 error
  // 字段 + 人话,gRPC status 不承载业务失败(与既有风格对齐);gRPC status
  // 仅留给鉴权/传输层错误。
  rpc DelegateSubTask(DelegateSubTaskRequest) returns (DelegateSubTaskResponse);

  // ---- 协同角色(分工编排):可复用的"子代理岗位"(只增)----
  // 为什么需要这一层:
  // 委派原本只能在**每次调用**时传 model/effort/task —— 父模型要让某个子代理
  // 反复扮演同一角色(例如"审查者":只找安全问题、不要改代码、用便宜模型),
  // 就得把整段人设在每个 task 里复述一遍,改口径更是要改 N 处。角色表把这部分
  // 抽出来:一次配置,后续所有委派按 id 引用即生效。
  // 边界(刻意不做):daemon **不自动编排分工** —— 谁在什么时候派给谁,由父
  // 模型(经 MCP 工具入参)或手机端决定。让 daemon 替用户猜分工,既不可预测
  // 也不可控,那是假智能。
  rpc ListCollabRoles(ListCollabRolesRequest) returns (ListCollabRolesResponse);
  // 按 role.id 幂等 upsert;id 为空 = 新建(daemon 生成),同名/同 id 覆盖。
  rpc SetCollabRole(SetCollabRoleRequest) returns (SetCollabRoleResponse);
  rpc DeleteCollabRole(DeleteCollabRoleRequest) returns (DeleteCollabRoleResponse);

  // ---- 协同扇出:一条指令交给**多个 agent 并行执行**(只增)----
  // 语义与委派(DelegateSubTask)根本不同:委派是**父子**(父 agent 自己决定
  // 派活给谁);本 RPC 是**并行协作** —— 用户在协同页选好若干 agent、发一条
  // 指令,daemon 给每个 agent 各开一个子线程同时跑,它们之间对等、无父子。
  // 【为什么不开"谁先谁后 / 谁汇总"的编排】那是让 daemon 替用户猜分工,既不
  // 可预测也不可控;协同页的选人 + 角色配置已经把决策权交回用户手里。
  rpc DispatchCollab(DispatchCollabRequest) returns (DispatchCollabResponse);

  // ---- 协同会话闭环:快照 / 观察 / 取消 / 重试(只增,2026-10-04 协同闭环计划)----
  // 【为什么从"派发即完"升级成会话聚合】DispatchCollab 只回答"受理了没有",
  // 不回答"后来怎么样了" —— 手机端离开协同页再回来,看到的是一组散落的子线程
  // 状态,凑不出"2/3 已完成 · 1 个等待确认"。引入持久化 CollabSession 后,daemon
  // 是协同状态的唯一事实来源:快照(Get/List)负责恢复,事件流(Watch)负责跟随,
  // 取消/重试负责干预。全部 additive:旧客户端继续只用 DispatchCollab 不受影响。
  // 【为什么状态是 string 不是 enum】会话/成员状态(ACCEPTED/RUNNING/COMPLETED/
  // FAILED/CANCELLED/WAITING_APPROVAL)由 daemon 状态机定义,协议先按字符串透传;
  // 状态集稳定后再冻结枚举,避免半成品枚举把客户端锁死在错误词表上。
  // 单个协同会话的完整快照(会话级状态 + 全体成员卡片)。
  rpc GetCollabSession(GetCollabSessionRequest) returns (CollabSessionSnapshot);
  // 列出协同会话(最简全量形态;筛选交给手机端,daemon 不猜口径)。
  rpc ListCollabSessions(ListCollabSessionsRequest) returns (ListCollabSessionsResponse);
  // 订阅单个协同会话的事件流:先回放 seq > after_sequence 的既有事件,再跟随
  // 实时事件,直至会话终局或客户端取消。断线重连后带 lastSequence 续传;
  // 超出保留窗口时由服务端改发一帧全量 snapshot 兜底。
  rpc WatchCollabSession(WatchCollabSessionRequest) returns (stream CollabSessionEvent);
  // 取消整个协同会话:逐成员发起取消并等待状态收敛,返回收敛后的会话快照。
  rpc CancelCollabSession(CancelCollabSessionRequest) returns (CollabSessionSnapshot);
  // 只取消一个成员(对应子线程),不动其它成员。
  rpc CancelCollabMember(CancelCollabMemberRequest) returns (CollabMemberSnapshot);
  // 重试一个成员:创建新的成员轮次(不覆盖旧结果),返回新成员快照。
  rpc RetryCollabMember(RetryCollabMemberRequest) returns (CollabMemberSnapshot);
}

// ---- /计划:发起计划审查(只增,字段号从 1 起,不碰旧消息)----

message StartReviewRequest {
  string thread_id = 1;  // 会话 id(必须已存在于本地库)
  // 审查重点(可空):空 = daemon 侧用默认口径(审查会话中拟定的计划);
  // 非空 = 原样作为 codex 自由指令(custom target 的 instructions)下发。
  string focus = 2;
}

message StartReviewResponse {
  // 承载本次审查的 codex 线程 id(实测 inline 模式 = 原线程 id,与请求线程
  // 一致)。手机端只拿它做诊断回指,审查结果完全依赖事件流展示。
  string review_id = 1;
  // 发起成功(失败走 gRPC 错误,不会出现 false;字段留给未来异步语义)。
  bool started = 2;
}

// ---- 跨 agent 委派:T-L2fix 单写者重构(只增,字段号从 1 起,不碰旧消息)----

message DelegateSubTaskRequest {
  // 目标 agent 的 id(如 "echo"/"pi";空或未知 → error 字段人话报错,
  // daemon 不猜、不路由)。
  string agent_id = 1;
  // 要委派的有界子任务描述(必填)。
  string task = 2;
  // 工作区覆盖;空 = daemon 默认工作区。
  string workspace = 3;
  // 模型覆盖(形如 "agent/model-id");空 = 该 agent 当前默认。
  string model = 4;
  // 思考强度覆盖;空 = 该 agent 当前默认。
  string effort = 5;
  // 发起方(父)线程的 daemon 本地 id(T-S1Pa,只增,可选):非空 = 委派建的
  // 子线程落库 parent_thread_id = 该值,手机端据此点亮子代理内联卡;空 =
  // 子线程父链为空(诚实变暗,卡不亮不误报),与旧行为一致。
  // 【v1 限制】pi 侧经 pi-mcp-adapter 的委派暂填不出该值(mcp.json 是静态
  // 共享文件、MCP 服务器进程懒启动跨会话共享,无会话上下文注入机制);
  // 未来 piapp 具备会话感知注入时,由薄代理把当前线程 id 填进请求本字段,
  // 链路即一行接通。
  string parent_thread_id = 6;
  // 引用的协同角色 id(可选):非空 = daemon 取出该角色,把它的人设注入子任务
  // prompt、并用它的 model/effort/workspace 兜底本请求的空字段
  // (**本请求显式给的值优先级更高**,角色只填空)。
  // 【为什么只传一个 id 而不是整段人设】父模型应当在委派时说明"这次具体做什么";
  // "这次具体做什么";角色回答"我是谁、长期怎么干"。两者职责不同,都传才完整。
  // 未知 id → error 字段人话报错(**不猜、不回落到默认**,否则父模型永远发现
  // 不了自己写错了角色名)。
  string role_id = 7;
}

message DelegateSubTaskResponse {
  // 委派子线程 id(委派被引擎入口拒绝时为空;子线程已建但轮次失败时仍回填,
  // 便于调用方事后 agent_status 查询)。
  string child_thread_id = 1;
  // 子任务终稿摘要(失败时为空,不伪造)。
  string summary = 2;
  // 子线程在委派返回时点的状态(engine 口径:idle/failed/running/queued/…;
  // 无法判定时留空)。子线程后续状态变化不在本 RPC 的跟踪范围内。
  string state = 3;
  // 业务失败的人话说明(agent 不存在 / 深度锁拒绝 / 子轮次失败等);
  // 空 = 成功。不靠 gRPC status 承载业务失败(与既有风格对齐)。
  string error = 4;
}

// ---- 协同角色:一个"岗位"(审查者 / 测试员 / 重构手 …)的可复用配置 ----

message CollabRole {
  // 稳定 id(自定义 slug,如 "reviewer";同一 daemon 内唯一)。set 时用幂等键。
  string id = 1;
  // 显示名(手机端展示用,如 "安全审查者")。
  string name = 2;
  // 落到哪个原生 agent(pi / codex / dsh / zcode ...),与委派的 agent_id 同域。
  string agent_id = 3;
  // 这个岗位是干什么的(职责边界)。会前置注入到**每次**委派的子任务 prompt。
  string description = 4;
  // 长期生效的追加要求(输出格式 / 只做不改 / 必须列证据 …),同样前置注入。
  string instructions = 5;
  // 模型覆盖(形如 "agent/model-id");空 = 用该 agent 当前默认。
  string model = 6;
  // 思考强度覆盖;空 = 用该 agent 当前默认。
  string effort = 7;
  // 工作区覆盖;空 = daemon 默认工作区。
  string workspace = 8;
}

message ListCollabRolesRequest {}

message ListCollabRolesResponse {
  repeated CollabRole roles = 1;
}

message SetCollabRoleRequest {
  CollabRole role = 1;
}

message SetCollabRoleResponse {
  // 回显落库后的角色(id 可能被 daemon 补生成),便于手机端立刻刷新成真值。
  CollabRole role = 1;
}

message DeleteCollabRoleRequest {
  string id = 1;
}

message DeleteCollabRoleResponse {}

// ---- 协同扇出 ----

// 参与本次协同的一员:落到哪个 agent、扮演哪个角色(角色可空)。
message CollabMember {
  // 目标 agent id;为空时取 role_id 对应角色里配的 agent(两者都空 = 人话报错)。
  string agent_id = 1;
  // 协同角色 id(可空):非空则取该角色的人设与 model/effort/workspace 兜底。
  string role_id = 2;
}

message DispatchCollabRequest {
  // 用户发出的指令原文(必填)。所有成员收到的是**同一条**指令 —— 这正是
  // "共同完成一个任务"与"逐个委派不同子任务"的区别。
  string instruction = 1;
  // 参与成员(至少一个)。
  repeated CollabMember members = 2;
  // 工作区覆盖;空 = 各成员用角色值或 daemon 默认。
  string workspace = 3;
}

// 单个成员的受理结果:一个成员失败不影响其它成员(并行扇出的应有语义)。
message DispatchCollabItem {
  string agent_id = 1;
  // 为该成员建的子线程 id;受理失败时为空。
  string thread_id = 2;
  // 是否受理(子线程已建、轮次已起飞)。受理 ≠ 执行成功:结果看子线程状态。
  bool ack = 3;
  // 受理失败的人话原因(agent 不存在 / 角色未定义等);成功时为空。
  string error = 4;
}

message DispatchCollabResponse {
  // 本次协同的会话 id(便于前端归组与事后回溯;等于各成员子线程的父链)。
  string session_id = 1;
  // 与请求 members **一一对应、顺序一致**(前端按位置回填每个 agent 的相位)。
  repeated DispatchCollabItem items = 2;
}

// ---- zcode 会话的斜杠命令面板(只增,字段号从 1 起,不碰旧消息)----

message ListSlashCommandsRequest {
  string thread_id = 1;  // 会话 id(必须已存在于本地库)
  bool refresh = 2;
}

// SlashCommand 快照顶层 slashCommands[] 的一项(元素形状为实测:
// {"description":"…","inputHint":"/goal …","name":"goal"},见
// daemon/docs/verify/evidence/zcode-p0-probe-raw.log)。
message SlashCommand {
  string name = 1;         // 命令名(不带斜杠,如 "goal")
  string description = 2;  // 一句话说明
  string input_hint = 3;   // 参数提示(如 "/goal [pause|resume|…]",可为空)
}

message ListSlashCommandsResponse {
  // 空 = 非 zcode 会话或快照暂不可用(手机端不显示候选条)。
  repeated SlashCommand commands = 1;
}

// ---- 提示词优化(只增,字段号从 1 起,不碰旧消息)----

message OptimizePromptRequest {
  string text = 1;    // 输入栏里的原始文本(trim 后必须非空)
  // 预留的改写风格:concise = 压缩到一句话;detailed = 展开细节;
  // 空 = 默认(保持长度量级,把意思说清楚)。daemon 侧按此拼优化指令。
  string style = 2;
  string agent_id = 3;
  string model_id = 4;
  string effort = 5;
}

message OptimizePromptResponse {
  string optimized = 1;  // 改写后的文本(空 = 服务端已报错,不会出现)
}

// ---- 会话导出:离线 HTML 存档(只增,字段号从 1 起,不碰旧消息)----

