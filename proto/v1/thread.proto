}

message ExportThreadHtmlResponse {
  // 电脑上的 HTML 绝对路径(会话工作区/.pocketagent-exports/<threadId>.html)。
  // 手机端拿它走现有 ReadFile(FileChunk 流)下载;同线程重复导出会覆盖旧文件。
  string path = 1;
}

message ApproveGuardianDeniedActionRequest {
