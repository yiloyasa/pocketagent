syntax = "proto3";

package pocketagent.v1;

option java_multiple_files = true;

option go_package = "github.com/pocketagent/daemon/internal/gen/pocketagent/v1;pocketagentv1";

import "v1/common.proto";

// ============ 会话(Thread)服务:聊天 + agent 执行 ============

service ThreadService {
  rpc CreateThread(CreateThreadRequest) returns (Thread);
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (Thread);
  rpc DeleteThread(DeleteThreadRequest) returns (Empty);
  rpc ArchiveThread(ArchiveThreadRequest) returns (Thread);
  rpc RenameThread(RenameThreadRequest) returns (Thread);
  rpc SetThreadGoal(SetThreadGoalRequest) returns (Thread); // 常驻目标/上下文说明
  rpc CompactThread(CompactThreadRequest) returns (Empty);  // 历史压缩,省 token

  // 核心:执行一轮 agent。客户端 → 服务端:用户输入/中途补充/审批应答;
  // 服务端 → 客户端:文本增量/工具调用/审批请求/turn 结束。
  rpc StartTurn(stream TurnClientMessage) returns (stream TurnServerMessage);

  rpc CancelTurn(CancelTurnRequest) returns (Empty);

  // 历史消息(打开旧会话时拉取)
  rpc GetThreadHistory(GetThreadHistoryRequest) returns (GetThreadHistoryResponse);

  // 电脑上 codex 已有的会话:列出 + 导入(绑定为本地线程,可继续聊)
  rpc ListCodexThreads(ListCodexThreadsRequest) returns (ListCodexThreadsResponse);
  rpc ImportCodexThread(ImportCodexThreadRequest) returns (ImportCodexThreadResponse);

  // ---- 会话组织:分组 / 分支 / 回滚 ----
  // 【为什么 fork 和 rollback 必须二次确认】两者都会改变"这个会话之后是什么" ——
  // fork 会分出一条新会话,rollback 会直接丢掉最近 N 个回合。手机上误触的代价比
  // 电脑上高得多(屏幕小、手指滑一下就点到),所以 App 侧必须弹确认再调。
  rpc ForkThread(ForkThreadRequest) returns (Thread);
  rpc RollbackThread(RollbackThreadRequest) returns (Thread);

  rpc ListThreadSections(ListThreadSectionsRequest) returns (ListThreadSectionsResponse);
  rpc CreateThreadSection(CreateThreadSectionRequest) returns (ThreadSection);
  rpc RenameThreadSection(RenameThreadSectionRequest) returns (ThreadSection);
  rpc DeleteThreadSection(DeleteThreadSectionRequest) returns (Empty);
  rpc MoveThreadToSection(MoveThreadToSectionRequest) returns (Thread);

  // 审查者(guardian/自动审查)拒绝之后,用户推翻它的结论并要求继续执行。
  // 手机端不提供这个按钮的话,用户看到的就是"任务莫名其妙失败了"。
  rpc ApproveGuardianDeniedAction(ApproveGuardianDeniedActionRequest) returns (Empty);
}

message ApproveGuardianDeniedActionRequest {
  string thread_id = 1;
  string review_id = 2;       // 来自 item/autoApprovalReview/* 的 reviewId
  string target_item_id = 3;  // 被审查的那个动作对应 item
}

message ForkThreadRequest {
  string thread_id = 1;
  string last_turn_id = 2;    // 从哪个回合之后分叉;空 = 最新
}

message RollbackThreadRequest {
  string thread_id = 1;
  int32 num_turns = 2;        // 回滚最近 N 个回合(必须 > 0)
}

message ThreadSection {
  string id = 1;
  string name = 2;
  string color = 3;           // 外观(appearance.color),空 = 默认
  string icon = 4;            // 外观(appearance.icon)
  int32 thread_count = 5;     // 该分组下的会话数(daemon 统计)
}

message ListThreadSectionsRequest {}
message ListThreadSectionsResponse { repeated ThreadSection sections = 1; }

message CreateThreadSectionRequest { string name = 1; }
message RenameThreadSectionRequest { string section_id = 1; string name = 2; }
message DeleteThreadSectionRequest { string section_id = 1; }

message MoveThreadToSectionRequest {
  string thread_id = 1;
  string section_id = 2;      // 空 = 移出分组
}

message ListCodexThreadsRequest {}
message CodexThreadInfo {
  string id = 1;            // codex 线程 id(rollout 文件名里的 uuid)
  string title = 2;         // 首条用户消息摘要
  string cwd = 3;           // 会话工作目录
  int64 updated_at_unix_ms = 4;
}
message ListCodexThreadsResponse { repeated CodexThreadInfo threads = 1; }

message ImportCodexThreadRequest { string codex_thread_id = 1; }
message ImportCodexThreadResponse { string thread_id = 2; }

message GetThreadHistoryRequest {
  string thread_id = 1;
  int32 limit = 2;   // 0 = 全部
}

message GetThreadHistoryResponse {
  repeated ThreadMessage messages = 1;
}

message ThreadMessage {
  string role = 1;               // user / assistant
  repeated ContentBlock blocks = 2;
  int64 created_at_unix_ms = 3;
}

message Thread {
  string id = 1;
  string title = 2;            // 自动摘要标题
  string workspace = 3;        // 绑定的工作区路径
  string goal = 4;             // 常驻目标
  string model_id = 5;
  ThreadStatus status = 6;
  int64 created_at_unix_ms = 7;
  int64 updated_at_unix_ms = 8;
  int32 message_count = 9;
  // 桥接的 codex 线程 id:非空表示本会话来自电脑上的 codex 会话。
  // 手机端用它把"活跃"与"电脑"两处同一个会话合并成一条(不去重会出现两份)。
  string codex_thread_id = 10;
  // ---- 会话组织(字段号从 11 起,旧字段语义一字未动) ----
  string section_id = 11;      // 所属分组;空 = 未分组
  bool archived = 12;          // 归档状态(codex 侧 thread/archived|unarchived 的真实值)
  // 审查者(guardian)最近一次驳回:非空表示"自动审查已经拒了这个动作,
  // 用户可以推翻"。手机端据此显示"仍然执行"入口。
  string guardian_denied_review_id = 13;
  string guardian_denied_item_id = 14;
  string guardian_denied_reason = 15;
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_IDLE = 1;
  THREAD_STATUS_RUNNING = 2;
  THREAD_STATUS_WAITING_APPROVAL = 3;
  THREAD_STATUS_ARCHIVED = 4;
}

message CreateThreadRequest {
  string workspace = 1;
  string title = 2;
  string model_id = 3;   // 空 = 用默认模型
}

message ListThreadsRequest {
  bool include_archived = 1;
  int32 limit = 2;       // 0 = 全部
  // ---- 服务端过滤(交给 codex 的 thread/list,比在手机上过滤整表更省) ----
  string search_term = 3;   // 按标题/内容搜索;空 = 不过滤
  string section_id = 4;    // 只看某个分组;空 = 全部分组
  string sort_key = 5;      // created / updated;空 = 默认(updated)
  bool sort_ascending = 6;  // 默认 false(新的在前)
}
message ListThreadsResponse { repeated Thread threads = 1; }

message GetThreadRequest { string thread_id = 1; }
message DeleteThreadRequest { string thread_id = 1; }
message ArchiveThreadRequest { string thread_id = 1; bool archived = 2; }
message RenameThreadRequest { string thread_id = 1; string title = 2; }
message SetThreadGoalRequest { string thread_id = 1; string goal = 2; }
message CompactThreadRequest { string thread_id = 1; }

// ---- Turn 双向流 ----

message TurnClientMessage {
  oneof msg {
    TurnInput input = 1;              // 开场:用户本轮输入
    TurnSupplement supplement = 2;    // 中途补充信息
    ApprovalDecision approval = 3;    // 审批应答
    CancelSignal cancel = 4;
  }
}

message TurnInput {
  string thread_id = 1;
  repeated ContentBlock blocks = 2;   // 文本/图片混合输入
  bool background = 3;                // 后台跑,完成走推送
  // 每轮覆盖(可选):切换模型/思考强度,只影响本轮及之后
  string model_id = 4;                // "codex/gpt-5.4" 风格;空=沿用
  string effort = 5;                  // low/medium/high/xhigh;空=沿用
}

message TurnSupplement {
  repeated ContentBlock blocks = 1;
}

message ApprovalDecision {
  string request_id = 1;
  bool approved = 2;
  string note = 3;  // 拒绝时的说明,agent 可见
}

message CancelSignal { string reason = 1; }

message TurnServerMessage {
  oneof msg {
    TurnStarted started = 1;
    TextDelta text_delta = 2;         // 流式文本增量
    ThinkingDelta thinking_delta = 3;
    ToolCallUpdate tool_call = 4;     // 工具调用开始/结果
    ApprovalRequest approval_request = 5;
    UsageUpdate usage = 6;
    TurnCompleted completed = 7;
    TurnFailed failed = 8;
    CodexEvent codex_event = 9;       // Codex 原生错误/重试/状态事件
    // 审批请求已被桌面端/codex 侧处理(serverRequest/resolved):
    // 手机端必须立即关闭正在展示的审批卡,否则会残留"幽灵审批卡"
    // (桌面端已放行/拒绝,手机上却还挂着一张点不动也没意义的卡)。
    ApprovalResolved approval_resolved = 10;
  }
}

message ApprovalResolved {
  // 对应 ApprovalRequest.request_id;为空 = "当前挂着的审批卡"(codex 的
  // 审批请求在同一会话内是串行的,单槽位足够)。
  string request_id = 1;
  // 人话说明,展示在时间线里,让用户明白卡为什么消失。
  string note = 2;
}

// Codex app-server 的原生状态和错误事件。
// 事件先实时发送给手机，再由最终 TurnFailed/TurnCompleted 收尾。
message CodexEvent {
  enum Kind {
    CODEX_EVENT_UNSPECIFIED = 0;
    ERROR = 1;
    RETRY_STARTED = 2;
    RETRY_STOPPED = 3;
    STATUS = 4;
    WARNING = 5;
    MODEL_REROUTED = 6;
    RATE_LIMIT = 7;
    CONTEXT_COMPACTED = 8;
    // ---- 以下为"彻底接入"补齐的事件类型 ----
    // 审查者(guardian/auto_review)对某个动作的判定过程与结论。
    // 【为什么单独一类】它不是错误也不是警告:动作可能被**自动拒绝**,
    // 而用户的 approvals_reviewer 一旦不是 user,审批卡根本不会弹。
    // 不展示的话,用户看到的就是"任务莫名其妙失败"。
    GUARDIAN_REVIEW = 9;
    // 本回合的文件改动 diff(turn/diff/updated)。手机端渲染成可折叠的代码块。
    TURN_DIFF = 10;
    // codex 自己的弃用/配置/沙箱警告:以前这些通知我们直接丢掉了。
    DEPRECATION = 11;
    CONFIG_WARNING = 12;
    SANDBOX_WARNING = 13;
    // hooks 执行与技能变化:回答"它到底跑了什么、有哪些能力"。
    HOOK = 14;
    SKILLS_CHANGED = 15;
    // 会话排队状态变化(用户连续发消息时,后面的在排队)。
    QUEUE = 16;
    // 模型安全缓冲/校验:属于"为什么这次输出很慢/被拦了"的解释面。
    MODEL_SAFETY = 17;
  }
  Kind kind = 1;
  string code = 2;          // CodexErrorInfo 或事件代码
  string title = 3;        // 面向用户的标题
  string message = 4;      // 面向用户的详细信息
  string url = 5;           // 上游 URL
  int32 http_status = 6;    // 上游 HTTP 状态
  bool will_retry = 7;      // Codex 是否会继续重试
  int32 attempt = 8;        // 若 Codex 提供重试次数
  int64 retry_after_ms = 9; // 若 Codex 提供冷却时间
  string thread_id = 10;
  string turn_id = 11;
  // ---- 结构化附带信息(字段号从 12 起)----
  string risk_level = 12;      // GUARDIAN_REVIEW:low / medium / high / critical
  string review_status = 13;   // inProgress / approved / denied / timedOut / aborted
  string review_id = 14;       // 用于"仍然执行"时回指这一次审查
  string target_item_id = 15;  // 被审查的动作
  string rationale = 16;       // 审查者的理由(人脸话,直接展示)
  string diff = 17;            // TURN_DIFF:统一 diff 文本
  string raw_json = 18;    // 诊断用原始参数, UI 默认不直接展示
  // turn/plan/updated 的执行计划步骤,每项格式 "status|text"
  // (status: pending/in_progress/completed)。UI 渲染为步骤卡。
  repeated string plan_steps = 19;
}

message TurnStarted {
  string turn_id = 1;
  string model_id = 2;
}

message TextDelta { string delta = 1; }
message ThinkingDelta { string delta = 1; }

message ToolCallUpdate {
  enum Phase {
    UNSPECIFIED = 0;
    STARTED = 1;    // 已发起(有 id+name+args)
    FINISHED = 2;   // 已有结果
  }
  Phase phase = 1;
  ToolCallBlock call = 2;
  ToolResultBlock result = 3;
}

message ApprovalRequest {
  string request_id = 1;
  // 需要审批的动作描述,如即将执行的命令 / 将写入的文件
  ToolCallBlock action = 2;
  string reason = 3;   // agent 给出的理由
}

message UsageUpdate {
  Usage usage = 1;         // 本 turn 累计
  Usage total_usage = 2;   // 本 thread 累计
  // codex thread/tokenUsage/updated 上报的真实窗口大小;
  // 模型列表拉不到各模型的窗口时,以这里为准(切模型后也能显示)。
  int64 model_context_window = 3;
}

message TurnCompleted {
  string turn_id = 1;
  repeated ContentBlock final_blocks = 2; // 完整最终消息(增量重组成)
  Usage usage = 3;
  int64 elapsed_ms = 4;
}

message TurnFailed {
  string turn_id = 1;
  Error error = 2;
  string partial_text = 3; // 失败前已生成的文本
}

message CancelTurnRequest { string thread_id = 1; }
