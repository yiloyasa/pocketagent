// ---- 电脑上 pi / zcode 已有会话(通用,agent_id 区分)----

message ListAgentThreadsRequest {
  string agent_id = 1;   // "pi" / "zcode";空 = 两个都列(codex 走 ListCodexThreads,不在这)
}
message AgentThreadInfo {
  string agent_id = 1;         // "pi" / "zcode"
  string session_id = 2;       // 外部会话 id(Pi 的 sessionId / ZCode 的 sess_*);导入去重与续聊重挂载的关键
  string session_file = 3;     // 外部会话文件绝对路径(Pi 必有;ZCode 走协议时为空 —— 续聊只要 sessionId)
  string cwd = 4;              // 会话绑定的工作目录(Pi 来自文件头 cwd 字段;ZCode 来自 workspace.workspacePath)
  string title = 5;            // 首条用户消息摘要(Pi)/ ZCode 自动命名或首条输入
  int64 updated_at_unix_ms = 6; // Pi = 文件修改时间;ZCode = session/list 的 updatedAt
}
message ListAgentThreadsResponse { repeated AgentThreadInfo threads = 1; }

// 导入请求:手机端把 ListAgentThreads 里选中的一项原样回传即可。
// session_id / session_file 至少有一个非空,daemon 才能在续聊时重挂载外部会话。
message ImportAgentThreadRequest {
  string agent_id = 1;
  string session_id = 2;
  string session_file = 3;
  string cwd = 4;
  string title = 5;
}
message ImportAgentThreadResponse { string thread_id = 1; }

message GetThreadHistoryRequest {
  string thread_id = 1;
  int32 limit = 2;   // 0 = 全部
  // 按轮截断:0 = 不限(兼容旧客户端:存量 APK 不传本字段,必须仍返回全量,
  // 导出全量与断流恢复回填都依赖这个语义)。一轮 = 一条 user 起始,到下一条
  // user 之前(失败轮可能只有 user 无 assistant;导入/fork 种子首条不保证
  // user)。与 limit 并存时先按 limit 尾截,再按 rounds 叠加收窄;默认值
  // (最近 20 轮)由 android 端显式传,服务端不内置默认。
  int32 rounds = 3;
}

message GetThreadHistoryResponse {
  repeated ThreadMessage messages = 1;
  // 打开会话时顺带回读的 codex 目标态(仅 codex 线程;非 codex / 读不到 = 缺省,
  // 手机端有则显示"目标:xxx",无则不占位)。
  CodexGoalDetail goal_detail = 2;
}

message ThreadMessage {
  string role = 1;               // user / assistant
  repeated ContentBlock blocks = 2;
  int64 created_at_unix_ms = 3;
}

message Thread {
  string id = 1;
  string title = 2;            // 自动摘要标题
  string workspace = 3;        // 绑定的工作区路径
  string goal = 4;             // 常驻目标
  string model_id = 5;
  ThreadStatus status = 6;
  int64 created_at_unix_ms = 7;
  int64 updated_at_unix_ms = 8;
  int32 message_count = 9;
  // 桥接的 codex 线程 id:非空表示本会话来自电脑上的 codex 会话。
  // 手机端用它把"活跃"与"电脑"两处同一个会话合并成一条(不去重会出现两份)。
  string codex_thread_id = 10;
  // ---- 会话组织(字段号从 11 起,旧字段语义一字未动) ----
  string section_id = 11;      // 所属分组;空 = 未分组
  bool archived = 12;          // 归档状态(codex 侧 thread/archived|unarchived 的真实值)
  // 审查者(guardian)最近一次驳回:非空表示"自动审查已经拒了这个动作,
  // 用户可以推翻"。手机端据此显示"仍然执行"入口。
  string guardian_denied_review_id = 13;
  string guardian_denied_item_id = 14;
  string guardian_denied_reason = 15;
  // ---- 多 agent 接入(只增:16~17)----
  // 会话归属的 agent:"codex" / "pi" / …。老记录缺省 = "codex"(见 store 兼容规则)。
  // providerFor 按它显式选择 provider,不再静默回退默认。
  string agent_id = 16;
  // 外部 agent 的原生会话引用(Pi/ZCode 通用):daemon 重启后据此 switch_session
  // 重挂载子进程会话(调研 §8.3 的握手依据)。
  ExternalSessionRef external_session = 17;
  // ---- codex 目标态回读(只增:18)----
  // 【与字段 4 goal 的分工】4 是 daemon 本库落库的常驻目标(手机设置后写的值);
  // goal_detail 是打开会话时 daemon 从电脑端 codex 线程**现读**的目标态
  // (thread/goal/get),带状态机与 token 消耗 —— 重连/换端后以它为准刷新。
  // 仅 codex 线程填充;读不到/非 codex 会话缺省(手机端"有则显示,无则不占位")。
  CodexGoalDetail goal_detail = 18;
  string effort = 19;
  string last_turn_error = 20;
  repeated ApprovalRequest pending_approvals = 21;
  // ---- 子代理线程归属(只增:22)----
  // 非空 = 该线程是某线程的子代理线程,值为**父线程的 daemon 本地线程 id**
  // (手机端按它与当前打开会话的 id 匹配,点亮子代理内联卡/来源行;空 =
  // 普通顶层会话,门控关闭不误报)。两条填充路:collab 委派子线程在建线程时
  // 落库;codex 原生子线程在 thread/started 通知(带 parentThreadId)到达时以
  // 轻量存根登记落库。
  string parent_thread_id = 22;
  // ---- 轮次开始时刻(只增:23)----
  // 当前 RUNNING 段的开始时刻。手机端对运行中会话显示"运行 N 分钟",
  // 不再退化为"最近活动·相对时间"。optional 显式缺席 = 未知:旧 daemon
  // 不带、尚未开轮的会话不带;daemon 重启后仍处于 RUNNING 的会话由 daemon
  // 记**重启时刻**(真实开始不可追溯,仅作展示锚点)。
  optional int64 turn_started_unix_ms = 23;
}

// CodexGoalDetail codex 线程目标态(thread/goal/get 应答的归一)。
// daemon 侧现读失败但本地库有目标时,objective 兜底为本地值(status 留空)。
message CodexGoalDetail {
  string objective = 1;        // 目标文本
  string status = 2;           // active / paused / blocked / usageLimited / budgetLimited / complete(空 = 未知)
  int64 tokens_used = 3;       // 已消耗 token
  int64 token_budget = 4;      // 预算上限(0 = 未设)
  int64 time_used_seconds = 5; // 已投入秒数
}

// ExternalSessionRef 指向外部 agent 自己管理的会话事实来源。
// Pi:session_file 是 ~/.pi/agent/sessions 下的 .jsonl;ZCode 同样以"外部会话 id
// + 文件路径"重挂载。内容由外部 agent 持有,我们只存引用。
message ExternalSessionRef {
  string session_id = 1;    // 外部会话 id(Pi 的 sessionId / ZCode 的会话 id)
  string session_file = 2;  // 外部会话文件绝对路径(Pi 的 sessionFile)
  string cwd = 3;           // 外部会话绑定的工作目录(Pi 会话创建后不可换)
}

enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_IDLE = 1;
  THREAD_STATUS_RUNNING = 2;
  THREAD_STATUS_WAITING_APPROVAL = 3;
  THREAD_STATUS_ARCHIVED = 4;
}

message CreateThreadRequest {
  string workspace = 1;
  string title = 2;
  string model_id = 3;   // 空 = 用默认模型
  // 目标 agent:"codex" / "pi" / …;空 = 默认(codex)。多 agent 接入(只增)。
  string agent_id = 4;
}

message ListThreadsRequest {
  bool include_archived = 1;
  int32 limit = 2;       // 0 = 全部
  // ---- 服务端过滤(交给 codex 的 thread/list,比在手机上过滤整表更省) ----
  string search_term = 3;   // 按标题/内容搜索;空 = 不过滤
  string section_id = 4;    // 只看某个分组;空 = 全部分组
  string sort_key = 5;      // created / updated;空 = 默认(updated)
  bool sort_ascending = 6;  // 默认 false(新的在前)
}
message ListThreadsResponse { repeated Thread threads = 1; }

message GetThreadRequest { string thread_id = 1; }
message DeleteThreadRequest { string thread_id = 1; bool local_only = 2; }
message ArchiveThreadRequest { string thread_id = 1; bool archived = 2; }
message RenameThreadRequest { string thread_id = 1; string title = 2; }
message SetThreadGoalRequest { string thread_id = 1; string goal = 2; }
message CompactThreadRequest { string thread_id = 1; }

// ---- Turn 双向流 ----

message TurnClientMessage {
  oneof msg {
    TurnInput input = 1;              // 开场:用户本轮输入
    TurnSupplement supplement = 2;    // 中途补充信息
    ApprovalDecision approval = 3;    // 审批应答
    CancelSignal cancel = 4;
  }
}

message TurnInput {
  string thread_id = 1;
  repeated ContentBlock blocks = 2;   // 文本/图片混合输入
  bool background = 3;                // 后台跑,完成走推送
  // 每轮覆盖(可选):切换模型/思考强度,只影响本轮及之后
  string model_id = 4;                // "codex/gpt-5.4" 风格;空=沿用
  string effort = 5;                  // low/medium/high/xhigh;空=沿用
}

message TurnSupplement {
  repeated ContentBlock blocks = 1;
}

message ApprovalDecision {
  string request_id = 1;
  bool approved = 2;
  string note = 3;  // 拒绝时的说明,agent 可见
  // ---- C1 只增不改 ----
  // 新端三按钮时填选项 id(与卡 options[].id 对应,如 acceptForSession /
  // cancel);为空 = 旧端 approved/note 语义,daemon 行为一字不变。
  // daemon 会把它与 note 包装成 {"option":..,"note":..} 信封并入 note 传给
  // provider,provider 侧解析(见 agent.parseApprovalChoice)。
  string option = 4;
}

message CancelSignal { string reason = 1; }

message TurnServerMessage {
  oneof msg {
    TurnStarted started = 1;
    TextDelta text_delta = 2;         // 流式文本增量
    ThinkingDelta thinking_delta = 3;
    ToolCallUpdate tool_call = 4;     // 工具调用开始/结果
    ApprovalRequest approval_request = 5;
    UsageUpdate usage = 6;
    TurnCompleted completed = 7;
    TurnFailed failed = 8;
    CodexEvent codex_event = 9;       // Codex 原生错误/重试/状态事件
    // 审批请求已被桌面端/codex 侧处理(serverRequest/resolved):
    // 手机端必须立即关闭正在展示的审批卡,否则会残留"幽灵审批卡"
    // (桌面端已放行/拒绝,手机上却还挂着一张点不动也没意义的卡)。
    ApprovalResolved approval_resolved = 10;
    // ---- P1-4 运行中继续发消息(只增不改:11~13 为新增帧)----
    // 该输入已通过 codex 的 turn/steer 插入正在运行的轮次(不新开轮次)。
    Steered steered = 11;
    // 该输入已进入 daemon 内存队列,等当前轮次终局后自动执行。
    Queued queued = 12;
    // 队列开始执行:紧跟着会有该轮的 Started 帧与常规增量。
    QueueFlushed queue_flushed = 13;
    // after_sequence 已超出保留窗口(轮转丢弃)或事件库不可用:立即走
    // GetThreadHistory 全量回填,不要再增量拼接。本帧是流里的唯一一帧。
    ResyncRequired resync_required = 15;
  }
  // ---- P1-5 事件断点续传(只增不改:14~15 为新增)----
  // 全局单调事件序号(daemon events.jsonl 的 seq):daemon 发出的每一个真实
  // 事件帧都带序号,手机记录收到的最大值;断线重连后用
  // GetThreadEventsSince(thread_id, after_sequence=lastSequence) 增量补帧。
  // 0 = 无序号(旧 daemon / 该帧未入事件库),手机端按无续传能力处理。
  int64 sequence = 14;
}

// ---- P1-5:增量续传请求与截断提示(新增)----

message GetThreadEventsSinceRequest {
  string thread_id = 1;
  int64 after_sequence = 2;  // 手机已应用的最大 seq;服务端回放该线程 seq 更大的帧
}

// ResyncRequired:请求的区间已无法可靠回放(典型原因:events.jsonl 轮转把
// 更早的事件删掉了)。收到本帧后手机端 lastSequence 作废,退回全量回填。
message ResyncRequired {
  string reason = 1;  // 人话原因,仅用于日志/诊断展示
}

// ---- P1-4:运行中追加输入的回传消息(新增,字段号全部从 1 起,不动旧消息)----

// Steered 确认:这条输入已插入正在运行的轮次(codex turn/steer 成功)。
message Steered {
  string turn_id = 1;        // 当前运行中轮次的 id(daemon 侧生成)
  string codex_turn_id = 2;  // codex 侧返回的 turnId(可能为空)
}

// Queued 确认:这条输入已排队。position 从 1 起;
// position == 0 表示队列已满被拒收(上限 10 条),手机端应把该消息
// 标记为"未送达"而不是"排队中"。
message Queued {
  int32 position = 1;  // 第几位(1 起;0 = 被拒收:队列满)
  int32 depth = 2;     // 入队后队列总长
}

// QueueFlushed:排队的输入开始执行。turn_id 是即将开始的那一轮的 id;
// remaining 是出队后队列里还剩几条。
message QueueFlushed {
  string turn_id = 1;
  int32 remaining = 2;
}

message ApprovalResolved {
  // 对应 ApprovalRequest.request_id;为空 = "当前挂着的审批卡"(codex 的
  // 审批请求在同一会话内是串行的,单槽位足够)。
  string request_id = 1;
  // 人话说明,展示在时间线里,让用户明白卡为什么消失。
  string note = 2;
}

// Codex app-server 的原生状态和错误事件。
// 事件先实时发送给手机，再由最终 TurnFailed/TurnCompleted 收尾。
message CodexEvent {
  enum Kind {
    CODEX_EVENT_UNSPECIFIED = 0;
    ERROR = 1;
    RETRY_STARTED = 2;
    RETRY_STOPPED = 3;
    STATUS = 4;
    WARNING = 5;
    MODEL_REROUTED = 6;
    RATE_LIMIT = 7;
    CONTEXT_COMPACTED = 8;
    // ---- 以下为"彻底接入"补齐的事件类型 ----
    // 审查者(guardian/auto_review)对某个动作的判定过程与结论。
    // 【为什么单独一类】它不是错误也不是警告:动作可能被**自动拒绝**,
    // 而用户的 approvals_reviewer 一旦不是 user,审批卡根本不会弹。
    // 不展示的话,用户看到的就是"任务莫名其妙失败"。
    GUARDIAN_REVIEW = 9;
    // 本回合的文件改动 diff(turn/diff/updated)。手机端渲染成可折叠的代码块。
    TURN_DIFF = 10;
    // codex 自己的弃用/配置/沙箱警告:以前这些通知我们直接丢掉了。
    DEPRECATION = 11;
    CONFIG_WARNING = 12;
    SANDBOX_WARNING = 13;
    // hooks 执行与技能变化:回答"它到底跑了什么、有哪些能力"。
    HOOK = 14;
    SKILLS_CHANGED = 15;
    // 会话排队状态变化(用户连续发消息时,后面的在排队)。
    QUEUE = 16;
    // 模型安全缓冲/校验:属于"为什么这次输出很慢/被拦了"的解释面。
    MODEL_SAFETY = 17;
  }
  Kind kind = 1;
  string code = 2;          // CodexErrorInfo 或事件代码
  string title = 3;        // 面向用户的标题
  string message = 4;      // 面向用户的详细信息
  string url = 5;           // 上游 URL
  int32 http_status = 6;    // 上游 HTTP 状态
  bool will_retry = 7;      // Codex 是否会继续重试
  int32 attempt = 8;        // 若 Codex 提供重试次数
  int64 retry_after_ms = 9; // 若 Codex 提供冷却时间
  string thread_id = 10;
  string turn_id = 11;
  // ---- 结构化附带信息(字段号从 12 起)----
  string risk_level = 12;      // GUARDIAN_REVIEW:low / medium / high / critical
  string review_status = 13;   // inProgress / approved / denied / timedOut / aborted
  string review_id = 14;       // 用于"仍然执行"时回指这一次审查
  string target_item_id = 15;  // 被审查的动作
  string rationale = 16;       // 审查者的理由(人脸话,直接展示)
  string diff = 17;            // TURN_DIFF:统一 diff 文本
  string raw_json = 18;    // 诊断用原始参数, UI 默认不直接展示
  // turn/plan/updated 的执行计划步骤,每项格式 "status|text"
  // (status: pending/in_progress/completed)。UI 渲染为步骤卡。
  repeated string plan_steps = 19;
}

message TurnStarted {
  string turn_id = 1;
  string model_id = 2;
  optional string effort = 3;
  bool configuration_confirmed = 4;
}

message TextDelta { string delta = 1; }
message ThinkingDelta { string delta = 1; }

message ToolCallUpdate {
  enum Phase {
    UNSPECIFIED = 0;
    STARTED = 1;    // 已发起(有 id+name+args)
    FINISHED = 2;   // 已有结果
    // 进行中进度(多 agent 接入新增,只增不改):Pi 的 tool_execution_update
    // 持续吐进度,partialResult 是**累积值**,App 端按 callId 原地替换(不追加)。
    UPDATE = 3;
  }
  Phase phase = 1;
  ToolCallBlock call = 2;
  ToolResultBlock result = 3;
}

// ApprovalOption 审批卡上的一个可选项(C1:codex 0.159.2 三按钮审批增量)。
// daemon 在审批卡 JSON(action.json_args)里同步带同样的 options/details;
// 旧手机对未知 proto 字段与未知 JSON 键都忽略,仍按 approved 双按钮渲染,
// 新手机读 options 渲染第三按钮 —— 新旧端互不破坏。
message ApprovalOption {
  // 选项 id,codex 应答枚举原词(accept / acceptForSession / decline,
  // 旧版 approved / approved_for_session / denied)。应答时原样回填
  // ApprovalDecision.option,daemon 按协议版本翻译。
  string id = 1;
  string label = 2;       // 按钮文案,如"本次及本会话允许"
  string description = 3; // 次级说明,如"本会话内同类请求不再询问"
}

message ApprovalRequest {
  string request_id = 1;
  // 需要审批的动作描述,如即将执行的命令 / 将写入的文件
  ToolCallBlock action = 2;
  string reason = 3;   // agent 给出的理由
  // ---- C1 只增不改:4~5 为 codex 0.159.2 三按钮审批新增 ----
  repeated ApprovalOption options = 4; // 可选项列表(旧端忽略,仍见两按钮)
  string details = 5;                  // 人话详情(proposedExecpolicyAmendment / commandActions 摘要)
}

message UsageUpdate {
  Usage usage = 1;         // 本 turn 累计
  Usage total_usage = 2;   // 本 thread 累计
  // codex thread/tokenUsage/updated 上报的真实窗口大小;
  // 模型列表拉不到各模型的窗口时,以这里为准(切模型后也能显示)。
  int64 model_context_window = 3;
}

// OutputState 说明「这一轮的最终正文是怎么来的」。
//
// 【为什么需要它】此前适配器把空正文伪装成 "(完成,无文本输出)" 这样一条**普通
// assistant 文本**发出来,手机端无法区分三种完全不同的情况:
//   - 真的没话说(EMPTY);
//   - 只产出了非文本产物,比如图片/文件(ARTIFACT_ONLY);
//   - 适配器把正文弄丢了,原生历史里其实有(ADAPTER_LOST_OUTPUT / RECOVERED_*)。
// 用户看到的都是"任务完成 + 一句占位文案",于是无从判断该不该重试。
enum OutputState {
  // 旧 daemon 未上报:手机端按 final_blocks 自行判断(向后兼容)。
  OUTPUT_STATE_UNSPECIFIED = 0;
  OUTPUT_STATE_TEXT = 1;
  // 确实没有正文(也没有产物)—— 这是事实陈述,不是错误。
  OUTPUT_STATE_EMPTY = 2;
  // 只有非文本块(图片/附件等),没有正文。
  OUTPUT_STATE_ARTIFACT_ONLY = 3;
  // 轮次失败(正文见 TurnFailed.partial_text)。
  OUTPUT_STATE_ERROR = 4;
  // 增量流丢了正文,已从原生历史(thread/read)补偿回真实正文。
  OUTPUT_STATE_RECOVERED_FROM_NATIVE_HISTORY = 5;
  // 适配器确认丢了正文,且原生历史也补不回来 —— 必须让用户知道"该重试",
  // 而不是假装任务正常完成。
  OUTPUT_STATE_ADAPTER_LOST_OUTPUT = 6;
}

message TurnCompleted {
  string turn_id = 1;
  repeated ContentBlock final_blocks = 2; // 完整最终消息(增量重组成)
  Usage usage = 3;
  int64 elapsed_ms = 4;
  OutputState output_state = 5;
  // output_source 正文来源的可读标注("delta" / "item_completed" /
  // "turn_items" / "native_history"),诊断用,手机端可忽略。
  string output_source = 6;
  // diagnostic_id 关联的诊断事件 id(有诊断可查时非空)。
  string diagnostic_id = 7;
}

message TurnFailed {
  string turn_id = 1;
  Error error = 2;
  string partial_text = 3; // 失败前已生成的文本
}

message CancelTurnRequest { string thread_id = 1; }

// ---- 撤回排队输入(pi 0.87.1 clear_queue,只增,字段号从 1 起,不碰旧消息)----

message ClearQueuedInputsRequest {
  string thread_id = 1;  // 目标会话(必须是 pi 会话)
}

message ClearQueuedInputsResponse {
  // 被撤销的条数,两个口径与 pi 的队列一致:steered = 插队(当前轮还没结束、
  // 会被优先消费的),follow_up = 排队(当前轮结束后依次执行的)。
  int32 steered = 1;
  int32 follow_up = 2;
}

message SubmitApprovalRequest {
  string thread_id = 1;
  ApprovalDecision decision = 2;
}

// ---- 会话内消息内容搜索(只增,字段号从 1 起,不碰旧消息)----

message SearchThreadMessagesRequest {
  string thread_id = 1;  // 会话 id(必须已存在于本地库)
  // 搜索词(trim 后必须非空):对消息正文(文本块)做大小写不敏感的包含匹配。
  string query = 2;
  // 返回命中条数上限:0 = 默认 20;负数同 0;超过 100 钳到 100(daemon 侧钳制,
  // 手机端不必自行防御)。命中按消息序号升序返回(先出现的先回)。
  int32 limit = 3;
}

// ThreadMessageHit 一条命中:sequence 是该消息在会话消息数组里的 0 基下标,
// 与 GetThreadHistory 返回顺序一致 —— 手机端据此定位跳转/取整条正文。
// snippet 是命中处的摘录(匹配词 + 前后文各 40 字符,截断处以 … 标示),
// 只含文本正文;思考块/工具调用参数刻意不搜(那是过程不是正文)。
message ThreadMessageHit {
  int32 sequence = 1;             // 消息在会话消息数组中的下标(0 基)
  string role = 2;                // user / assistant
  string snippet = 3;             // 命中摘录(含匹配词与前后文)
  int64 created_at_unix_ms = 4;   // 消息时间戳(透传 store 值;0 = 未知)
}

message SearchThreadMessagesResponse {
  // 无命中 = 空列表(不是错误);命中超出 limit 时截断(不回总数,客户端
  // 拿"满 limit"自行判断可能还有更多,避免为计数多做一次全扫)。
  repeated ThreadMessageHit hits = 1;
}

// ---- 协同会话闭环(只增,字段号从 1 起,不碰旧消息;字段号分配登记见
// proto/FIELD_ALLOCATIONS.md,2026-10-04 协同闭环计划 Task 1)----

// CollabSessionSnapshot 一次协同会话的完整快照:会话级状态 + 全体成员卡片。
// daemon 是协同状态的唯一事实来源 —— 手机端打开协同页先用本消息恢复整屏,
// 再用 WatchCollabSession 增量跟随;两者给的必须一致。
message CollabSessionSnapshot {
  string session_id = 1;          // 协同会话 id(DispatchCollab 返回的那个)
  string instruction = 2;         // 用户发出的指令原文(全体成员共用的那条)
  // 会话状态:string 口径,取值随 daemon 状态机(如 running / completed /
  // failed / cancelled);旧 daemon 可能给空,客户端如实显示"未知",不编造。
  string status = 3;
  string workspace = 4;           // 协同工作区(未隔离时各成员共享)
  int64 created_at_unix_ms = 5;   // 会话创建时刻;0 = 未知
  int64 updated_at_unix_ms = 6;   // 会话最近更新时刻;0 = 未知
  repeated CollabMemberSnapshot members = 7; // 全体成员卡片(顺序 = 受理顺序)
  string error = 8;               // 会话级失败原因(人话);空 = 无
}

// CollabMemberSnapshot 协同会话里一个成员的实时卡片:它是谁、跑到哪、等什么。
// 【为什么 pending_approvals 内嵌在成员卡上】"一个成员等审批、其他成员继续跑"
// 是协同的常态 —— 审批挂在自己的成员卡上,才不会把整个会话误报成卡死。
message CollabMemberSnapshot {
  string agent_id = 1;   // 落到哪个 agent(pi / codex / …)
  string role_id = 2;    // 扮演的协同角色 id;空 = 未用角色
  string thread_id = 3;  // 该成员的子线程 id(取消/重试/审批都按它定位)
  // 成员状态:string 口径(ACCEPTED / RUNNING / COMPLETED / FAILED /
  // CANCELLED / WAITING_APPROVAL 等);空 = 未知,客户端如实显示。
  string status = 4;
  string model_id = 5;   // 实际使用的模型(形如 "agent/model-id")
  string effort = 6;     // 思考强度(low / medium / high / …);空 = 默认
  string progress = 7;   // 一句话进度(daemon 侧有界摘要,不是原始日志)
  string summary = 8;    // 成功时的终稿摘要;失败/取消时为空,不伪造
  string error = 9;      // 失败/取消的人话原因;空 = 无
  // 该成员当前挂起的审批:复用既有 ApprovalRequest(带真实 thread_id/request_id),
  // 手机端继续用 SubmitApproval 应答,不新增审批通道。旧 daemon 为空。
  repeated ApprovalRequest pending_approvals = 10;
  string workspace = 11; // 该成员实际的工作区(隔离 worktree 时与会话级不同)
}

// WatchCollabSessionRequest 订阅单个协同会话的事件流。
message WatchCollabSessionRequest {
  string session_id = 1;  // 要观察的协同会话 id
  // 续传水位:只回放 seq 更大的事件(与 GetThreadEventsSince 同一口径);
  // 0 = 从头回放。超出保留窗口时由服务端改发一帧全量 snapshot 兜底。
  int64 after_sequence = 2;
}

// CollabSessionEvent 协同会话的一帧事件:要么是细粒度变化(kind + member),
// 要么是整屏快照(snapshot)。sequence 全局单调递增,客户端记录最大值做续传。
message CollabSessionEvent {
  int64 sequence = 1;           // 全局单调事件序号(0 = 旧 daemon 无序号)
  string session_id = 2;        // 归属的协同会话 id
  string member_thread_id = 3;  // 变化涉及的成员子线程;空 = 会话级事件
  // 事件种类:string 口径(ACCEPTED / RUNNING / COMPLETED / FAILED /
  // CANCELLED / WAITING_APPROVAL / SNAPSHOT 等);客户端遇到不认识的取值
  // 必须按 snapshot 兜底刷新,不得报错。
  string kind = 4;
  // 整屏快照:重连恢复 / 续传超窗 / 客户端不认识 kind 时的兜底真值。
  CollabSessionSnapshot snapshot = 5;
  // 单成员变化:与 member_thread_id 对应的成员卡片(整卡真值,非 diff)。
  CollabMemberSnapshot member = 6;
}

// GetCollabSessionRequest 取单个协同会话快照。
message GetCollabSessionRequest {
  string session_id = 1;  // 协同会话 id;不存在走 gRPC NotFound(人话)
}

// ListCollabSessionsRequest 列出协同会话(最简全量形态,不做分页 ——
// 协同会话量级远小于普通会话,分页只会让手机端多一轮接线)。
message ListCollabSessionsRequest {
  // true = 连已结束的(completed / failed / cancelled)一起返回;
  // false = 只看进行中的。
  bool include_finished = 1;
}

message ListCollabSessionsResponse {
  repeated CollabSessionSnapshot sessions = 1; // 按创建时间倒序(新的在前)
}

message CancelCollabSessionRequest {
  string session_id = 1;  // 要取消的协同会话 id
}

message CancelCollabMemberRequest {
  string session_id = 1;  // 成员所属的协同会话 id
  string thread_id = 2;   // 要取消的成员子线程 id
}

message RetryCollabMemberRequest {
  string session_id = 1;  // 成员所属的协同会话 id
  string thread_id = 2;   // 要重试的成员子线程 id(新轮次生成新结果,不覆盖旧值)
}
