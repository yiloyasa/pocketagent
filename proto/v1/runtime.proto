syntax = "proto3";

package pocketagent.v1;

option java_multiple_files = true;

option go_package = "github.com/pocketagent/daemon/internal/gen/pocketagent/v1;pocketagentv1";

// ============ 本机运行时服务(规格 §13 P1/P2、§14)============
//
// 【为什么预算策略要有一个 RPC 出口】在此之前,资源预算只能靠用户手编
// <数据目录>/runtime-policy.json,改完还得重启 daemon —— 那等于"有配置、没有控制面"。
// 手机端要能看、能改,才谈得上"策略"。
//
// 【错误语义】与既有 6 个服务一致,一律走 gRPC status(codes.InvalidArgument /
// FailedPrecondition / Internal ...),不在响应体里再放一份 Error —— 规格 §21.2
// 的草案允许响应内 Error,但两套错误语义并存会逼客户端判两处,且本项目既有实现
// 全部走 status。此处从既有实现,不从草案。
service RuntimeService {
  // 读回当前生效的预算策略(revision + 落盘位置)。
  // 【为什么 Set 之外还要 Get】手机换机/重装后没有本地副本;没有 Get,"能改"就等于
  // "只能盲改" —— 用户看不到当前值,也就无从判断改没改对。
  rpc GetRuntimePolicy(GetRuntimePolicyRequest) returns (RuntimePolicyResponse);
  // 提交新策略:校验 → 原子落盘 → 立即生效(不需要重启 daemon)。
  rpc SetRuntimePolicy(SetRuntimePolicyRequest) returns (RuntimePolicyResponse);
  // 查某作用域下的资源用量与限额(每个租约的 soft/hard 与压力档)。
  rpc GetResourceUsage(GetResourceUsageRequest) returns (ResourceUsageResponse);
  // 未知事件的诊断索引(规格 §9:未知事件要"可保存、可查询、可展示")。
  // 【为什么这三条必须存在】原生 agent 升级后会发来我们没见过的通知与反向请求;
  // 只把它们写进 daemon 日志,用户与手机端就永远看不到"最近到底来了什么" ——
  // 而那正是判断"要不要等上游支持/要不要关掉某个实验特性"的唯一依据。
  rpc ListUnknownEvents(ListUnknownEventsRequest) returns (ListUnknownEventsResponse);
  rpc GetUnknownEvent(GetUnknownEventRequest) returns (UnknownEventResponse);
  rpc AcknowledgeUnknownEvent(AcknowledgeUnknownEventRequest) returns (AcknowledgeUnknownEventResponse);
  // 协同策略(规格 §11):协同/委派/扇出的开关与扇出成员上限。
  // 【为什么放在 daemon】手机上的本地开关只是"这台设备当前的显示偏好",换台手机、
  // 重装 App 就没了;而"允不允许 agent 互相派活"是这台电脑的运行策略,必须由
  // daemon 持久化并作为唯一事实来源。
  rpc GetCollabPolicy(GetCollabPolicyRequest) returns (CollabPolicyResponse);
  rpc SetCollabPolicy(SetCollabPolicyRequest) returns (CollabPolicyResponse);
  // 本机运行时总览 + 每个 agent 的**能力声明核验**结果(规格 §10)。
  // 【为什么核验结果要经 RPC 出去】契约的价值在于"缺失可见":某家 agent 没申报
  // 运行时形态、或申报了却没交代必需入口,这些以前只写进 daemon 日志 —— 用户在
  // 手机上只会看到"这台 agent 好像少点什么",却指不出是哪一项。
  rpc GetRuntimeState(GetRuntimeStateRequest) returns (RuntimeStateResponse);
  // 单个 agent 的运行时形态与用量。
  rpc GetAgentRuntime(GetAgentRuntimeRequest) returns (AgentRuntimeResponse);
  // 按会话列出某 agent 名下的语义记忆(内存态 + 盘上 checkpoint 载荷合并视图)。
  // 【为什么按会话而不是整家一团】"哪几个会话占了记忆"回答不了,管理就无从谈起:
  // 用户需要的粒度是"把这个走歪了的会话的记忆清掉重新开始",不是"整家清空伤及无辜"。
  // loaded=false 的行 = 重启后从未触碰、值来自盘上落盘那一刻的快照 —— 两个口径
  // 分开报,客户端不得把"盘上快照"当成实时值展示。
  rpc ListThreadMemories(ListThreadMemoriesRequest) returns (ListThreadMemoriesResponse);
  // 清掉一个会话名下全部 PocketAgent 侧记忆(内存态 + 盘上 checkpoint),返回剩余合计。
  // 【红线】只动 PocketAgent 自己的数据目录;~/.codex、~/.pi 等原生侧的会话与用户
  // 数据一个字节都不碰。会话不存在时回 NotFound —— "没清任何东西"必须让客户端
  // 知道,不能谎报成功。
  rpc ClearThreadMemory(ClearThreadMemoryRequest) returns (ClearThreadMemoryResponse);
  // 控制面总览(聚合读):一个 RPC 回来 daemon 全部可控域的当前状态与能力,
  // 手机一个页面看全、就地改。
  // 【它只是呈现,不是新的写通道】这里不落任何新配置文件:切换动作仍走各自
  // 既有的 SetRuntimePolicy / SetCollabPolicy / SetCodexSettings /
  // AcknowledgeUnknownEvent / ClearThreadMemory —— 各控制通道早已存在,本 RPC
  // 补的是"一盘棋的总览",重写任何一条通道都只会制造第二份真值。
  // 【单域降级】某个域的状态取不到时,该域单独降级为 status_code=2 并说明原因,
  // 其余域照常返回 —— 总览页不该被一个域的故障掀翻。
  rpc GetControlPlane(GetControlPlaneRequest) returns (ControlPlane);
}

message GetRuntimePolicyRequest {}

message SetRuntimePolicyRequest {
  // 【提交的是**完整策略**,不是补丁】缺席的项 = 未设置(沿用上一级/内置基线),
  // 不是"不改这一项"。客户端改单项时请先 Get、在拿到的完整对象上改、再 Set
  // (并带上 revision 做 CAS)。参见 SetCollabPolicyRequest 的同款说明。
  RuntimePolicy policy = 1;
  // 期望的当前 revision;0 = 不做 CAS。
  // 【为什么需要 CAS】策略可能被两处同时改(手机设置页、电脑上直接编辑文件)。
  // 没有它,后提交的一方会静默覆盖另一方 —— 用户看到的是"我明明改过"。
  uint64 expected_revision = 2;
}

message RuntimePolicyResponse {
  RuntimePolicy policy = 1; // 用户配置(未设置的字段缺席 = 继承上一级)
  uint64 revision = 2;      // 每次成功写入 +1;0 = 从未落盘(仍在内置基线)
  string policy_path = 3;   // 落盘位置(用户要手改时知道改哪儿)
  // effective_global 是"内置基线 + global 覆盖"之后的**实际生效值**(全字段齐备)。
  //
  // 【为什么必须单独给,而不是让客户端拿 policy 自己判】policy 是一个带缺席字段的
  // 部分对象:用户只改了一项时,其余项在线上就是 0。客户端很容易把那个 0 显示成
  // "封禁了这一类资源"或"未知" —— 而真实生效的是内置基线(例如 max_parallel_turns=3)。
  // 客户端手里没有"内置基线"这份数据,合并只能由 daemon 做;把结果直接给出去,
  // 才做得到"看到的就是生效的"。
  RuntimeLimits effective_global = 4;
}

// RuntimeLimits 是某一级(全局 / agent / 工作区 / 会话 / 协同)上的额度。
//
// 【为什么每一项都是 optional】proto3 的零值分不清"这一项没设"与"显式设成 0",
// 而这两件事在预算里必须分开表达:未设 = 继承上一级;显式 0 = 明令封禁该类资源
// (与 daemon 侧 runtime.Limits 的指针语义一一对应)。混在一起的表现是:
// 用户明明关了并发,系统却继承了上一级的 3 继续并行。
message RuntimeLimits {
  optional int64 ram_working_bytes = 1;
  optional int64 ram_event_buffer_bytes = 2;
  optional int64 ram_session_index_bytes = 3;
  optional int64 disk_conversation_bytes = 4;
  optional int64 disk_cache_bytes = 5;
  optional int64 disk_artifact_bytes = 6;
  optional int32 max_parallel_turns = 7;
}

message RuntimePolicy {
  RuntimeLimits global = 1;
  map<string, RuntimeLimits> agents = 2;     // key = agent_id
  map<string, RuntimeLimits> workspaces = 3; // key = 工作区绝对路径
  map<string, RuntimeLimits> threads = 4;    // key = thread_id
  map<string, RuntimeLimits> collabs = 5;    // key = 协同 session id
}

message GetResourceUsageRequest {
  // 作用域:"" = 全部 / global / agent:<id> / workspace:<路径> / thread:<id> / collab:<id>。
  // 词汇表与 daemon 侧 runtime.Scope* 构造函数一致 —— 各处自己拼字符串必然拼出
  // "agent/echo" 与 "agent:echo" 两种写法,然后被当成两个 scope 各记一份账。
  string scope = 1;
}

message ResourceUsageResponse {
  repeated ResourceMetric metrics = 1;
  int64 sampled_at_unix_ms = 2; // 采样时刻(手机端可显示"多久前")
}

// ResourceMetric 是一条资源租约的**观察值**:额度与用量一起给。
//
// 【为什么必须带上限额】只给用量,"3 个并发"到底是"上限 3"还是"上限 30"看不出来,
// 用户也就无法判断该不该调;而限额的来历(哪一级给的)由 GetRuntimePolicy 回答。
message ResourceMetric {
  string lease_id = 1;
  string scope = 2;
  string kind = 3; // ram.working / ram.event_buffer / disk.conversation / concurrency.turns ...
  int64 reserved_bytes = 4;
  int64 used_bytes = 5;
  int64 soft_limit_bytes = 6;
  int64 hard_limit_bytes = 7;
  string state = 8;        // normal / soft / hard
  string spill_policy = 9; // compact / spill / reject
  bool optional = 10;      // true = 触硬上限时会被拒(可选资源)
}

// ---- 未知事件诊断(规格 §9)--------------------------------------------------

message ListUnknownEventsRequest {
  // normalized_kind:UNKNOWN_NOTIFICATION / UNKNOWN_REQUEST / UNKNOWN_RESPONSE;空 = 全部。
  string kind = 1;
  string agent_id = 2;        // 来源 agent;空 = 全部
  string thread_id = 3;       // 关联会话;空 = 全部
  string processing_status = 4; // NEW / INSPECTED / ...;空 = 全部
  int32 limit = 5;            // 最多返回条数;<=0 = 台账默认上限
}

// UnknownEventSummary 是列表项。原始载荷只在 GetUnknownEvent 才给 —— 列表页不需要
// 背着一堆可能很大的 payload。
message UnknownEventSummary {
  string event_id = 1;
  int64 sequence = 2;
  int64 received_at_unix_ms = 3;
  string source_agent = 4;
  string source_method = 5;   // 原生方法名原文(不翻译、不改写)
  string thread_id = 6;
  string normalized_kind = 7;
  string safety_class = 8;    // 目前恒为 UNKNOWN:分类规则未定,如实标注而非猜一个
  string processing_status = 9;
  uint64 revision = 10;       // 每次确认 +1
  // daemon 生成的一句话人话翻译:说「发生了什么」,不复述术语。
  // 翻译是摘要不是裁决 —— 原文永远可查(GetUnknownEvent.raw_json),冲突以原文为准。
  // 旧 daemon / 旧台账条目可能为空:客户端空值时显示方法名原文并如实说明,不得编造。
  string summary = 11;
}

// UnknownEventField 是字段级透析表的一行:把这个载荷「拆开读」的结果。
message UnknownEventField {
  string key = 1;      // 字段名原文
  string kind = 2;     // 值类型:text / number / bool / array / object / null
  string preview = 3;  // 脱敏后的值预览(超长截断;已随载荷整体脱敏)
  string meaning = 4;  // 字段含义的人话(可识别时给;识别不出留空,不猜)
}

message ListUnknownEventsResponse {
  repeated UnknownEventSummary items = 1;
  // 台账累计登记条数与因超上限丢弃的条数。
  // 【为什么必须给】只回最近 N 条而不说,用户会以为"就这么几条";这两个数让
  // "这里只留了最近 N 条、更早的已经丢了"变成明面上的事实。
  int64 total = 2;
  int64 dropped = 3;
}

message GetUnknownEventRequest {
  string event_id = 1;
}

message UnknownEventResponse {
  UnknownEventSummary summary = 1;
  string raw_json = 2;           // 脱敏后的原始载荷(密钥类字段已打码)
  string decoded_fields_json = 3; // 我们能解出来的部分;解不出来为空
  string note = 4;               // 确认时写下的一句话
  // 字段级透析表:载荷拆开读的每一行(见 UnknownEventField)。旧 daemon 为空。
  repeated UnknownEventField digest = 5;
  // 详细人话解读:比 summary 长 —— 字段怎么读、各部分像什么、daemon 打算怎么处理
  // (已投影/只透传/安全拒绝)。旧 daemon 为空。
  string translation = 6;
}

message AcknowledgeUnknownEventRequest {
  string event_id = 1;
  // NEW / INSPECTED / IGNORED / RETRY_LATER / ESCALATED / NEEDS_NATIVE_SUPPORT。
  // 非法取值回 InvalidArgument 并列出可用值 —— 静默写入客户端不认识的状态,
  // 表现是"点了确认但没变化"。
  string action = 2;
  string note = 3;
}

message AcknowledgeUnknownEventResponse {
  UnknownEventSummary item = 1;
}

// ---- 协同策略(规格 §11)----------------------------------------------------
//
// 【为什么只落这几项】规格 §11 还列了 auto_summarize / retain_artifacts /
// max_session_bytes —— 那三项在 daemon 侧目前没有对应的执行点。先放进契约就只是
// 一个"改了不生效"的开关,比不提供更糟:用户会以为功能坏了,而真正的原因是它
// 尚未实现。等执行点存在时再加字段。
message CollabPolicy {
  optional bool collaboration_enabled = 1;   // 协同总开关
  optional bool native_delegate_enabled = 2; // 委派(agent 派子任务)开关
  optional bool fanout_enabled = 3;          // 协同扇出(一次指令给多家并行)开关
  optional int32 max_parallel_members = 4;   // 单次扇出的成员数上限;<=0 = 不限
}

message GetCollabPolicyRequest {}

message SetCollabPolicyRequest {
  // 【提交的是**完整策略**,不是补丁】缺席的项 = 未设置(沿用默认),不是"不改这一项"。
  // 客户端改单项时请先 Get、在拿到的完整对象上改、再 Set(并带上 revision 做 CAS);
  // 只提交一个字段会把其它字段重置回默认 —— 实测踩到过:只关扇出会让成员上限
  // 从 2 变回"不限"。
  CollabPolicy policy = 1;
  uint64 expected_revision = 2; // 0 = 不做 CAS
}

message CollabPolicyResponse {
  CollabPolicy policy = 1;    // 用户配置(未设置的项缺席 = 沿用默认)
  uint64 revision = 2;        // 每次成功写入 +1
  string policy_path = 3;     // 落盘位置
  CollabPolicy effective = 4; // 打底默认之后的实际生效值(全字段齐备)
}

// ---- 运行时形态与契约核验(规格 §10)----------------------------------------

message GetRuntimeStateRequest {}

message RuntimeStateResponse {
  string installation_id = 1; // 安装身份(跨重启稳定;换机才变)
  string host_id = 2;
  string daemon_version = 3;
  uint64 budget_policy_revision = 4;
  uint64 collab_policy_revision = 5;
  // runtime_state:ready / degraded。degraded = 至少有一个 agent 的形态申报不合格
  // —— "有东西没交代清楚"本身就是需要用户知道的状态,不该只在日志里。
  string runtime_state = 6;
  int64 sampled_at_unix_ms = 7;
  repeated RuntimeContractReport contracts = 8;
  string data_dir = 9;
}

// RuntimeContractReport 是一个 agent 的运行时形态申报 + 核验结果。
//
// 【为什么把 descriptor 的六个 model 字段摊平给客户端】它们是"这家 agent 的会话
// 存在哪、能不能恢复、审批从哪来"的机器可读答案。手机端据此决定显示什么入口,
// 而不是按 agent 名字分支(那是项目红线)。
message RuntimeContractReport {
  string agent_id = 1;
  string display_name = 2;
  string version = 3;          // provider 自报;空 = 未探测到
  bool declared = 4;           // 是否实现了 runtime.Participant(连形态都没申报时为 false)
  repeated string capabilities = 5;
  repeated RuntimeContractIssue issues = 6;
  repeated RuntimeLimitation limitations = 7;
  string session_model = 8;    // NATIVE / DAEMON / HYBRID / NONE
  string resume_model = 9;     // native / reattach / none
  string approval_model = 10;  // native / daemon / none
  string subagent_model = 11;  // native / delegate / none
  string memory_model = 12;    // native / daemon / hybrid
  string cache_model = 13;     // native / daemon
}

// RuntimeContractIssue 一条契约违约(机器可读 code 见 runtime 包的 Violation*)。
message RuntimeContractIssue {
  string code = 1;
  string detail = 2;
}

// RuntimeLimitation 一条"我明确不支持"的声明及其原因。
message RuntimeLimitation {
  string capability = 1;
  string reason = 2;
}

message GetAgentRuntimeRequest {
  string agent_id = 1;
}

message AgentRuntimeResponse {
  RuntimeContractReport contract = 1;
  // 该 agent 作用域下当前活跃的资源租约(复用 GetResourceUsage 的同一个 message)。
  repeated ResourceMetric resources = 2;
  int64 sampled_at_unix_ms = 3;
  // 规格 §9.5「每家都能显示 memory/cache/resource/checkpoint/recovery 状态」的
  // 后四项。resource 见上面的 resources。
  AgentMemoryUsage memory = 4;
  AgentCacheUsage cache = 5;
  AgentCheckpointUsage checkpoint = 6;
  AgentRecoveryState recovery = 7;
}

// AgentMemoryUsage 是一个 agent 名下的语义记忆(按 agent 隔离聚合)。
message AgentMemoryUsage {
  int32 threads = 1;              // 涉及多少个 thread
  int32 items = 2;                // 条目总数
  int64 bytes = 3;                // 载荷字节数
  map<string, int32> kinds = 4;   // 分层计数:working / conversation / summary / artifact
}

// AgentCacheUsage 是一个 agent 名下的可再生缓存(按命名空间前缀聚合)。
message AgentCacheUsage {
  int32 namespaces = 1;
  int32 entries = 2;
  int64 bytes = 3;
  int64 hits = 4;
  int64 misses = 5;
  int64 evictions = 6;
}

// AgentCheckpointUsage 是一个 agent 名下的 checkpoint。
message AgentCheckpointUsage {
  int32 count = 1;
  int64 bytes = 2;
}

// AgentRecoveryState 是最近一次恢复尝试的结果。
//
// 【reported 为什么必须存在】目前 daemon 侧**还没有产出方**:恢复是跨重启的事件,
// 而 RecoveryState 挂在 per-thread 的临时 AgentRuntime 上,没人能填它。所以这里
// 恒为 reported=false —— 客户端据此显示"该 agent 未上报恢复状态",而不是把
// "没这一项"当成"恢复失败"。等产出方接上之后这个字段自然转 true。
message AgentRecoveryState {
  bool reported = 1;
  bool attempted = 2;
  bool succeeded = 3;
  string from = 4;    // checkpoint / native / corrupted / none
  string reason = 5;
  string at = 6;
}

// ---- 按会话的记忆清单与清除 --------------------------------------------------

message ListThreadMemoriesRequest {
  string agent_id = 1; // 必须是注册表里已注册的 agent,否则 InvalidArgument(文案动态列出已注册名单)
}

// ThreadMemoryRow 是清单里一个会话的记忆合计。
message ThreadMemoryRow {
  string thread_id = 1;
  int32 entries = 2;   // 条目数(全部 kind 槽合计)
  int64 bytes = 3;     // 载荷字节合计
  int64 seq = 4;       // sequence 高水位(该会话全部槽里的最大值)
  // 最后一次 checkpoint 落盘时刻(文件 mtime);0 = 从未落盘。
  int64 last_checkpoint_unix_ms = 5;
  // true = 本进程已装载(内存实时值);false = 重启后从未触碰,值来自盘上落盘那一刻
  // 的快照。两种口径必须分开:客户端把快照当实时值展示,就是在编一个"看起来更新"的数。
  bool loaded = 6;
}

message ListThreadMemoriesResponse {
  // 按字节降序(daemon 侧排好;同字节按 thread_id 字典序),客户端保持次序不再重排。
  repeated ThreadMemoryRow rows = 1;
  int32 total_threads = 2;
  int32 total_entries = 3;
  int64 total_bytes = 4;
  int64 sampled_at_unix_ms = 5;
}

message ClearThreadMemoryRequest {
  string agent_id = 1;
  string thread_id = 2; // 会话不存在时回 NotFound
}

message ClearThreadMemoryResponse {
  // 清除后该 agent 名下的剩余合计(客户端拿它刷新合计行,不必再发一次 List)。
  int32 total_threads = 1;
  int32 total_entries = 2;
  int64 total_bytes = 3;
}

// ---- 控制面总览(聚合读)------------------------------------------------------

message GetControlPlaneRequest {}

// ControlPlane 是 daemon 全部可控点的一次性快照。
//
// 【为什么是"域"的列表而不是大平铺】预算、协同、记忆……各有各的控制通道与
// 展示形态;按域分组后,客户端一页按域渲染,新域上线只是多一个条目,不必改版面。
// 【为什么全部人话由 daemon 给】summary/label/hint 与事件翻译(event_translate)
// 同一条纪律:daemon 给中文人话、不编造,状态取不到就如实写"未检测到/未报告";
// 客户端只按 id 匹配与排版,不做任何术语翻译。
message ControlPlane {
  // 服务与身份。
  string daemon_version = 1;
  string host_name = 2;
  string os = 3;
  // daemon 进程的启动时刻(unix 毫秒)。
  // 【为什么给"时刻"不给"时长"]客户端拿当前时刻一减即可显示"已运行多久",
  // 且不受快照往返延迟影响;时区与"多久前"的排版都留给客户端。
  int64 uptime_unix_ms = 4;
  // 各功能域状态与控制句柄(每域一个条目,客户端按 ControlDomain.id 呈现)。
  repeated ControlDomain domains = 5;
  // 数据目录落在哪个标准位置(如 LOCALAPPDATA / 家目录/.pocketagentd)。
  // 【为什么只给标签不给路径】绝对路径里的用户名属于敏感信息,诊断事实用不着它;
  // 要看落盘位置时,各策略响应里的 policy_path 已有完整路径。
  string data_dir_label = 6;
}

// ControlDomain 是一个功能域的当前状态。
message ControlDomain {
  // 域稳定键:budget / collab / agents / memory / dialysis / approvals /
  // transports / resources。客户端按 id 匹配,不按 title(title 是给人看的)。
  string id = 1;
  // 人话标题(daemon 给,客户端不翻译)。
  string title = 2;
  // 一句话当前状态(人话;如实描述,不编造)。
  string summary = 3;
  // 该域是否有写通道。写仍走各自既有 RPC —— 这里只是让客户端知道"可改",
  // 不必为每个域再实现一遍能力探测。
  bool writable = 4;
  // 0=正常 1=有注意项 2=受限。如实映射:2 可能只是"未装配/取不到",
  // 客户端把 summary 原文显示出来即可,不要自行把 2 渲染成"故障"。
  int32 status_code = 5;
  repeated ControlItem items = 6;
}

// ControlItem 是域内的一个可控点或事实点。
message ControlItem {
  // 域内稳定键,如 budget.global.ram_event_buffer_bytes。
  string id = 1;
  // 人话名。
  string label = 2;
  // 当前值(字符串化:数值/开关/原文)。
  string current = 3;
  // 呈现形态:toggle / select / number / info(只读事实)。
  string kind = 4;
  // select 型候选;其它 kind 为空。
  repeated string options = 5;
  // 一句说明(为什么有这个限制/改动影响什么)。
  string hint = 6;
}
