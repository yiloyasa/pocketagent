org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official

# ── B4 波次(Flutter add-to-app)─────────────────────────────────────────
# Flutter Gradle Plugin 在 apply 时校验 Gradle/Java/AGP/KGP 四个版本是否在它的
# 支持范围内(DependencyVersionChecker),低于下限即 fail-fast。本仓库锚定
# Gradle 8.9 + AGP 8.5.2 + KGP 2.0.20(见 android/build.gradle.kts),而当前
# Flutter SDK(3.47.7)的下限是 Gradle 8.14 / AGP 8.11.1 / KGP 2.2.20 ——
# 四项目前**全部低于** Flutter 下限。
#
# 【为什么不升级这四个版本】那是独立的升级轮:AGP 8.5.2→8.11+ 与 Gradle 8.9→8.14+
# 牵动 compileSdk/NDK/构建脚本行为,且本仓库有 proto 双副本、R8、ABI 收窄等多处
# 已按现行版本调过的配置;与「把 Flutter module 挂进宿主」混在一轮里做,红了
# 分不清是谁的锅(AUDIT:既有构建绿是硬红线)。故本轮只挂壳,不升工具链。
#
# 【为什么敢跳过校验】该校验只回答「Flutter 官方测没测过这个组合」,不检测实际
# 不兼容。真实不兼容会在编译/打包阶段以具体错误暴露——而本轮的验收标准正是
# 「assembleDebug 成功 + test 0 失败」,等价于把官方没测的组合实测一遍。
# 若将来真撞到 SDK 内部 API 不兼容,报错会点名具体 API,届时再按它升级,比现在
# 盲升四个版本更有的放矢。
# 取值说明:FlutterPlugin 读 `project.hasProperty("skipDependencyChecks")` +
# `.toBoolean()`,故必须是布尔字面量(不是 "1"/"yes")。
skipDependencyChecks=true
