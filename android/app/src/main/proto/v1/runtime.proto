syntax = "proto3";

package pocketagent.v1;

option java_multiple_files = true;

option go_package = "github.com/pocketagent/daemon/internal/gen/pocketagent/v1;pocketagentv1";

// ============ 本机运行时服务(规格 §13 P1/P2、§14)============
//
// 【为什么预算策略要有一个 RPC 出口】在此之前,资源预算只能靠用户手编
// <数据目录>/runtime-policy.json,改完还得重启 daemon —— 那等于"有配置、没有控制面"。
// 手机端要能看、能改,才谈得上"策略"。
//
// 【错误语义】与既有 6 个服务一致,一律走 gRPC status(codes.InvalidArgument /
// FailedPrecondition / Internal ...),不在响应体里再放一份 Error —— 规格 §21.2
// 的草案允许响应内 Error,但两套错误语义并存会逼客户端判两处,且本项目既有实现
// 全部走 status。此处从既有实现,不从草案。
service RuntimeService {
  // 读回当前生效的预算策略(revision + 落盘位置)。
  // 【为什么 Set 之外还要 Get】手机换机/重装后没有本地副本;没有 Get,"能改"就等于
  // "只能盲改" —— 用户看不到当前值,也就无从判断改没改对。
  rpc GetRuntimePolicy(GetRuntimePolicyRequest) returns (RuntimePolicyResponse);
  // 提交新策略:校验 → 原子落盘 → 立即生效(不需要重启 daemon)。
  rpc SetRuntimePolicy(SetRuntimePolicyRequest) returns (RuntimePolicyResponse);
  // 查某作用域下的资源用量与限额(每个租约的 soft/hard 与压力档)。
  rpc GetResourceUsage(GetResourceUsageRequest) returns (ResourceUsageResponse);
  // 未知事件的诊断索引(规格 §9:未知事件要"可保存、可查询、可展示")。
  // 【为什么这三条必须存在】原生 agent 升级后会发来我们没见过的通知与反向请求;
  // 只把它们写进 daemon 日志,用户与手机端就永远看不到"最近到底来了什么" ——
  // 而那正是判断"要不要等上游支持/要不要关掉某个实验特性"的唯一依据。
  rpc ListUnknownEvents(ListUnknownEventsRequest) returns (ListUnknownEventsResponse);
  rpc GetUnknownEvent(GetUnknownEventRequest) returns (UnknownEventResponse);
  rpc AcknowledgeUnknownEvent(AcknowledgeUnknownEventRequest) returns (AcknowledgeUnknownEventResponse);
  // 协同策略(规格 §11):协同/委派/扇出的开关与扇出成员上限。
  // 【为什么放在 daemon】手机上的本地开关只是"这台设备当前的显示偏好",换台手机、
  // 重装 App 就没了;而"允不允许 agent 互相派活"是这台电脑的运行策略,必须由
  // daemon 持久化并作为唯一事实来源。
  rpc GetCollabPolicy(GetCollabPolicyRequest) returns (CollabPolicyResponse);
  rpc SetCollabPolicy(SetCollabPolicyRequest) returns (CollabPolicyResponse);
}

message GetRuntimePolicyRequest {}

message SetRuntimePolicyRequest {
  // 【提交的是**完整策略**,不是补丁】缺席的项 = 未设置(沿用上一级/内置基线),
  // 不是"不改这一项"。客户端改单项时请先 Get、在拿到的完整对象上改、再 Set
  // (并带上 revision 做 CAS)。参见 SetCollabPolicyRequest 的同款说明。
  RuntimePolicy policy = 1;
  // 期望的当前 revision;0 = 不做 CAS。
  // 【为什么需要 CAS】策略可能被两处同时改(手机设置页、电脑上直接编辑文件)。
  // 没有它,后提交的一方会静默覆盖另一方 —— 用户看到的是"我明明改过"。
  uint64 expected_revision = 2;
}

message RuntimePolicyResponse {
  RuntimePolicy policy = 1; // 用户配置(未设置的字段缺席 = 继承上一级)
  uint64 revision = 2;      // 每次成功写入 +1;0 = 从未落盘(仍在内置基线)
  string policy_path = 3;   // 落盘位置(用户要手改时知道改哪儿)
  // effective_global 是"内置基线 + global 覆盖"之后的**实际生效值**(全字段齐备)。
  //
  // 【为什么必须单独给,而不是让客户端拿 policy 自己判】policy 是一个带缺席字段的
  // 部分对象:用户只改了一项时,其余项在线上就是 0。客户端很容易把那个 0 显示成
  // "封禁了这一类资源"或"未知" —— 而真实生效的是内置基线(例如 max_parallel_turns=3)。
  // 客户端手里没有"内置基线"这份数据,合并只能由 daemon 做;把结果直接给出去,
  // 才做得到"看到的就是生效的"。
  RuntimeLimits effective_global = 4;
}

// RuntimeLimits 是某一级(全局 / agent / 工作区 / 会话 / 协同)上的额度。
//
// 【为什么每一项都是 optional】proto3 的零值分不清"这一项没设"与"显式设成 0",
// 而这两件事在预算里必须分开表达:未设 = 继承上一级;显式 0 = 明令封禁该类资源
// (与 daemon 侧 runtime.Limits 的指针语义一一对应)。混在一起的表现是:
// 用户明明关了并发,系统却继承了上一级的 3 继续并行。
message RuntimeLimits {
  optional int64 ram_working_bytes = 1;
  optional int64 ram_event_buffer_bytes = 2;
  optional int64 ram_session_index_bytes = 3;
  optional int64 disk_conversation_bytes = 4;
  optional int64 disk_cache_bytes = 5;
  optional int64 disk_artifact_bytes = 6;
  optional int32 max_parallel_turns = 7;
}

message RuntimePolicy {
  RuntimeLimits global = 1;
  map<string, RuntimeLimits> agents = 2;     // key = agent_id
  map<string, RuntimeLimits> workspaces = 3; // key = 工作区绝对路径
  map<string, RuntimeLimits> threads = 4;    // key = thread_id
  map<string, RuntimeLimits> collabs = 5;    // key = 协同 session id
}

message GetResourceUsageRequest {
  // 作用域:"" = 全部 / global / agent:<id> / workspace:<路径> / thread:<id> / collab:<id>。
  // 词汇表与 daemon 侧 runtime.Scope* 构造函数一致 —— 各处自己拼字符串必然拼出
  // "agent/echo" 与 "agent:echo" 两种写法,然后被当成两个 scope 各记一份账。
  string scope = 1;
}

message ResourceUsageResponse {
  repeated ResourceMetric metrics = 1;
  int64 sampled_at_unix_ms = 2; // 采样时刻(手机端可显示"多久前")
}

// ResourceMetric 是一条资源租约的**观察值**:额度与用量一起给。
//
// 【为什么必须带上限额】只给用量,"3 个并发"到底是"上限 3"还是"上限 30"看不出来,
// 用户也就无法判断该不该调;而限额的来历(哪一级给的)由 GetRuntimePolicy 回答。
message ResourceMetric {
  string lease_id = 1;
  string scope = 2;
  string kind = 3; // ram.working / ram.event_buffer / disk.conversation / concurrency.turns ...
  int64 reserved_bytes = 4;
  int64 used_bytes = 5;
  int64 soft_limit_bytes = 6;
  int64 hard_limit_bytes = 7;
  string state = 8;        // normal / soft / hard
  string spill_policy = 9; // compact / spill / reject
  bool optional = 10;      // true = 触硬上限时会被拒(可选资源)
}

// ---- 未知事件诊断(规格 §9)--------------------------------------------------

message ListUnknownEventsRequest {
  // normalized_kind:UNKNOWN_NOTIFICATION / UNKNOWN_REQUEST / UNKNOWN_RESPONSE;空 = 全部。
  string kind = 1;
  string agent_id = 2;        // 来源 agent;空 = 全部
  string thread_id = 3;       // 关联会话;空 = 全部
  string processing_status = 4; // NEW / INSPECTED / ...;空 = 全部
  int32 limit = 5;            // 最多返回条数;<=0 = 台账默认上限
}

// UnknownEventSummary 是列表项。原始载荷只在 GetUnknownEvent 才给 —— 列表页不需要
// 背着一堆可能很大的 payload。
message UnknownEventSummary {
  string event_id = 1;
  int64 sequence = 2;
  int64 received_at_unix_ms = 3;
  string source_agent = 4;
  string source_method = 5;   // 原生方法名原文(不翻译、不改写)
  string thread_id = 6;
  string normalized_kind = 7;
  string safety_class = 8;    // 目前恒为 UNKNOWN:分类规则未定,如实标注而非猜一个
  string processing_status = 9;
  uint64 revision = 10;       // 每次确认 +1
}

message ListUnknownEventsResponse {
  repeated UnknownEventSummary items = 1;
  // 台账累计登记条数与因超上限丢弃的条数。
  // 【为什么必须给】只回最近 N 条而不说,用户会以为"就这么几条";这两个数让
  // "这里只留了最近 N 条、更早的已经丢了"变成明面上的事实。
  int64 total = 2;
  int64 dropped = 3;
}

message GetUnknownEventRequest {
  string event_id = 1;
}

message UnknownEventResponse {
  UnknownEventSummary summary = 1;
  string raw_json = 2;           // 脱敏后的原始载荷(密钥类字段已打码)
  string decoded_fields_json = 3; // 我们能解出来的部分;解不出来为空
  string note = 4;               // 确认时写下的一句话
}

message AcknowledgeUnknownEventRequest {
  string event_id = 1;
  // NEW / INSPECTED / IGNORED / RETRY_LATER / ESCALATED / NEEDS_NATIVE_SUPPORT。
  // 非法取值回 InvalidArgument 并列出可用值 —— 静默写入客户端不认识的状态,
  // 表现是"点了确认但没变化"。
  string action = 2;
  string note = 3;
}

message AcknowledgeUnknownEventResponse {
  UnknownEventSummary item = 1;
}

// ---- 协同策略(规格 §11)----------------------------------------------------
//
// 【为什么只落这几项】规格 §11 还列了 auto_summarize / retain_artifacts /
// max_session_bytes —— 那三项在 daemon 侧目前没有对应的执行点。先放进契约就只是
// 一个"改了不生效"的开关,比不提供更糟:用户会以为功能坏了,而真正的原因是它
// 尚未实现。等执行点存在时再加字段。
message CollabPolicy {
  optional bool collaboration_enabled = 1;   // 协同总开关
  optional bool native_delegate_enabled = 2; // 委派(agent 派子任务)开关
  optional bool fanout_enabled = 3;          // 协同扇出(一次指令给多家并行)开关
  optional int32 max_parallel_members = 4;   // 单次扇出的成员数上限;<=0 = 不限
}

message GetCollabPolicyRequest {}

message SetCollabPolicyRequest {
  // 【提交的是**完整策略**,不是补丁】缺席的项 = 未设置(沿用默认),不是"不改这一项"。
  // 客户端改单项时请先 Get、在拿到的完整对象上改、再 Set(并带上 revision 做 CAS);
  // 只提交一个字段会把其它字段重置回默认 —— 实测踩到过:只关扇出会让成员上限
  // 从 2 变回"不限"。
  CollabPolicy policy = 1;
  uint64 expected_revision = 2; // 0 = 不做 CAS
}

message CollabPolicyResponse {
  CollabPolicy policy = 1;    // 用户配置(未设置的项缺席 = 沿用默认)
  uint64 revision = 2;        // 每次成功写入 +1
  string policy_path = 3;     // 落盘位置
  CollabPolicy effective = 4; // 打底默认之后的实际生效值(全字段齐备)
}
