syntax = "proto3";

package pocketagent.v1;

option java_multiple_files = true;

option go_package = "github.com/pocketagent/daemon/internal/gen/pocketagent/v1;pocketagentv1";

// ============ 主机/会话服务:发现、认证、心跳 ============

service HostService {
  // 局域网发现后的第一问:你是谁、你能干什么
  rpc GetHostInfo(GetHostInfoRequest) returns (HostInfo);
  // 配对前置问询(2026-09-30 自动配对):返回当前配对码,供 USB/回环来源的
  // 手机自动完成配对(免手输)。handler 内自检来源必须为本机回环(USB reverse
  // 后手机请求即回环);局域网/Tailscale 来源一律拒绝 —— 物理接触才拿得到码。
  rpc GetPairingInfo(GetPairingInfoRequest) returns (GetPairingInfoResponse);
  // 配对码换长期 token
  rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  // 主机状态推送。当前唯一生产事件是 turn_finished(后台轮次完成,推送场景);
  // 早期规划的 workspace_changed/model_ready/update_available 三分支自基线起
  // 就无 daemon 生产点、app 零消费(2026-09-26 审计 R6/S2 双端 grep 实证),已删。
  // 重引入主机态事件时另起新字段号 —— 旧号已 reserved,复用会让持有旧契约的
  // 对端把新事件错解成旧消息类型。
  rpc WatchEvents(WatchEventsRequest) returns (stream HostEvent);
  // P2:列出本机正在运行的 dev server(daemon 拨常见端口,1s/端口,整扫 ≤8s,
  // 结果缓存 60s —— 手机手动刷新才重扫)。对齐原作 BrowserService.ListDevServers。
  rpc ListDevServers(ListDevServersRequest) returns (DevServerList);
}

message GetHostInfoRequest {}

message HostInfo {
  string host_id = 1;        // 稳定随机 ID
  string display_name = 2;   // 主机名,如 "YANZI-PC"
  string os = 3;             // windows / darwin / linux
  string arch = 4;           // amd64 / arm64
  string daemon_version = 5;
  repeated string workspaces = 6; // 已注册的工作区绝对路径
  repeated string capabilities = 7; // terminal / fs / git / agent / browser ...
  bool auth_required = 8;    // 是否必须先 Authorize
  string default_shell = 9;  // "powershell" / "bash" ...
  // 主机的 Tailscale IPv4(100.x.y.z),装了 Tailscale 才有;
  // 手机在外面(4G/其他 WiFi)时用这个地址直连,无需公网
  string tailscale_ipv4 = 10;
  // 主机的局域网 IPv4(192.168.x.x 等):同一 WiFi 下直连最快,
  // 不依赖 Tailscale 的 DERP 中继
  string lan_ipv4 = 11;
  // W6b:启动恢复诊断(规格 §8.2/§8.3)。把"这次启动走了哪条恢复路径、有没有数据
  // 损失"经 RPC 送到手机 —— 此前它只落在 daemon 日志里,用户在手机端无从知道
  // 「上次退出时还有几条排队输入没轮到执行」。旧 daemon 不带该字段 = 未报告,
  // 手机端据此隐藏该区块(禁用"未知/错误"措辞,AUDIT §3.3)。
  HostRecoveryReport recovery = 12;
}

message AuthorizeRequest {
  oneof method {
    string pair_code = 1;  // 手机扫二维码/手输的 6 位配对码
    string token = 2;      // 已配对过的长期 token 续期
    // 设备身份认证(P0-2):先要一个挑战数,再交 Keystore 签名换新 token
    string challenge_request = 6;          // 填 device_id,语义 = "给这台设备发挑战数"
    ChallengeAnswer challenge_answer = 7;  // 挑战应答:验签通过后发每设备新 token
  }
  string device_name = 3;  // "Pixel 9" 之类,便于主机端管理
  // 设备身份(P0-2):稳定的本机 UUID + base64 的 P-256 SPKI 公钥。
  // 选 P-256 而非 Ed25519:Android Keystore 支持 Ed25519 要 API 33,本项目 minSdk 26。
  string device_id = 4;
  string device_pub_key = 5;
}

// ChallengeAnswer:challenge_request 拿到挑战数后,手机用 Keystore 私钥
// 对 "device_id:challenge" 做 SHA256withECDSA 签名,签名走 base64。
message ChallengeAnswer {
  string challenge = 1;   // 原样带回 daemon 发的挑战数
  string signature = 2;   // base64(ASN.1 DER ECDSA 签名)
}

message AuthorizeResponse {
  string token = 1;        // 长期访问 token
  int64 expires_at_unix = 2; // 0 = 永不过期
  string challenge = 3;    // challenge_request 的应答:随机挑战数(其余分支为空)
  string device_id = 4;    // 回显注册/认证通过的设备 ID(便于手机端核对)
}

message PingRequest { int64 client_time_unix_ms = 1; }
message PingResponse {
  int64 server_time_unix_ms = 1;
  string status = 2; // "ok" / "busy" / "degraded"
}

// ---- P1-5:主机事件流断点续传(只增)----
message WatchEventsRequest {
  // 手机已收到的最大主机事件 seq;daemon 先补发仍保留的、seq 更大的落盘事件,
  // 再进入实时推送。0 = 不补发(只收实时)。
  int64 after_sequence = 1;
}

message HostEvent {
  int64 timestamp_unix_ms = 1;
  // 字段号 2/3/4 曾是 workspace_changed/model_ready/update_available 三个 oneof
  // 分支:契约初始规划的主机态事件,但自基线(a1e3699)起 daemon 就从未生产、app
  // 从未消费,唯一生产者只发 turn_finished(event_sequence.go emitTurnFinished);
  // 设计规范(superpowers/specs)亦无「预留事件位」条款,2026-09-26 按审计 R6 删除。
  // reserved 双保险:旧号/旧名不复用,防旧对端把新语义错解成已删消息类型。
  reserved 2, 3, 4;
  reserved "workspace_changed", "model_ready", "update_available";
  oneof event {
    TurnFinishedNotification turn_finished = 5; // 后台 turn 完成(推送场景)
  }
  // P1-5:全局单调事件序号(daemon events.jsonl),与 TurnServerMessage.sequence
  // 同一序列空间;0 = 未入事件库(旧 daemon)。
  int64 sequence = 6;
}

message TurnFinishedNotification {
  string thread_id = 1;
  string summary = 2; // 一句话结果摘要,可直接进通知栏
}

// ---- P2:电脑 dev server 探测(手机一键预览,对齐原作 BrowserService)----
message ListDevServersRequest {
  // 暂空 = 扫 daemon 内置的常见端口表(3000/3001/4200/5000/5173/5174/8000/
  // 8080/8081/8888/9000)。预留:以后让手机点名要扫的端口或强制重扫。
}

// DevServer:电脑上探到的一个 HTTP 服务端口。
message DevServer {
  int32 port = 1;           // 监听端口,如 5173
  string url = 2;           // daemon 本机视角的地址 http://127.0.0.1:5173;
                            // 手机端要自行把主机部分换成 daemon 的局域网/Tailscale 地址
  string title = 3;         // 首页 HTML 的 <title> 文本,取不到为空
  string server_header = 4; // HTTP Server 响应头(如 "Werkzeug/3.0 Python/3.12"),可为空
}

message DevServerList {
  repeated DevServer servers = 1;
  // 结果生成时间(daemon 本地时钟,Unix 毫秒)。手机端可提示"多久前扫的";0 = 旧 daemon。
  int64 scanned_at_unix_ms = 2;
}

// ---- W6b:启动恢复诊断(规格 §8.2 恢复三分支的进程级视图)----
//
// 【为什么整块单列,而不是把关键字段摊平进 HostInfo】这张表是"本次启动的健康度
// 快照",手机端作为一个单元整体呈现(顶部横幅 + 可展开明细);摊平后字段互相失去
// 归属,HostInfo 的后续演进也更容易撞号。
message HostRecoveryReport {
  // ok / degraded / corrupted —— 与 daemon 侧 RecoveryReport.Status 同值域。
  // 【为什么用 string 不用 enum】手机端只做透传展示,值域由 daemon 单方面定义;
  // 新增档位不该要求旧 APK 重新生成契约(旧枚举值会落进 UNRECOGNIZED)。
  string status = 1;
  string summary = 2;                     // 一句话人话摘要(日志与 UI 直接展示)
  HostStoreHealth store = 3;              // 会话库 threads.json 健康度
  HostTurnJournalHealth turn_journal = 4; // 排队输入台账:丢了几条、丢的是哪句
  HostDeviceHealth devices = 5;
  HostIdentityHealth identity = 6;
}

message HostStoreHealth {
  string outcome = 1;         // clean / first-run / quarantined
  bool has_backup = 2;        // 存在 threads.json.bak(损坏后可人工恢复)
  string quarantine_path = 3; // 解析失败时的留档路径(仅 quarantined 非空)
}

// HostTurnJournalHealth 是"排队输入丢失可见"的载体:条数、涉及会话、逐条明细。
// 【为什么条数与明细都要】只有条数,用户仍然不知道"丢的是哪句话";只有明细,
// 横幅文案又得在手机端重算总量。两者都给,各取所需。
message HostTurnJournalHealth {
  int32 pending_count = 1;
  repeated string thread_ids = 2;              // 涉及会话 id(去重,保持出现顺序)
  repeated HostLostQueueInput lost_inputs = 3; // 逐条明细(供用户辨认丢的是哪句)
}

message HostLostQueueInput {
  string thread_id = 1;
  string preview = 2;                // 输入文本前 120 字符(按 rune 截断)
  int64 created_at_unix_ms = 3;
}

message HostDeviceHealth {
  bool degraded = 1; // 设备表损坏 → 已 fail-closed 暂停远程认证
  string reason = 2;
}

message HostIdentityHealth {
  bool degraded = 1; // 身份文件不可用 → 本次改用临时 host id(手机会认为换了机器)
  string reason = 2;
}

// 配对前置问询(自动配对)。【安全模型】handler 仅应答本机回环来源(USB reverse
// 场景);daemon 关闭鉴权(-insecure-no-auth)时如实回答 pairing_enabled=false。
message GetPairingInfoRequest {}

message GetPairingInfoResponse {
  // true = 配对码模式开启,且本次来源被允许读取配对码。
  bool pairing_enabled = 1;
  // 当前生效配对码(持久码或一次性码均指它;配对成功即走 Authorize 换 token)。
  string pair_code = 2;
  // daemon 版本(便于手机端展示"发现的主机"卡片)。
  string daemon_version = 3;
}
