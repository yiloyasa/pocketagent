<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <style>
    /* 【P1-7 键栏】--kb-h = 键栏实际高度,由 JS 测量后写入 documentElement。
       #terminal 的 top 让位给它;键栏显隐只改这一个变量,top 一变,
       #terminal 的真实 clientHeight 就变,既有 ResizeObserver → fitAndReport
       链路自然重跑 fit 并向 PTY 上报新行数,不另起炉灶、不破坏高度链。 */
    :root { color-scheme: dark; --kb-h: 0px; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 石墨(编辑式 GraphiteCode #1A2430):内容区保持深色终端,
         与 app 的石墨代码箱/侧边栏同一深色层,不再是纯黑孤岛 */
      background: #1a2430;
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
    }
    #terminal {
      position: absolute;
      left: 0;
      /* 【P1-7 键栏】top 不再恒为 0:键栏可见时 = --kb-h(键栏实测高度),隐藏时 = 0。
         仍保持 absolute + bottom:0 锚定,高度永远来自 WebView 真实布局,
         fit 的 clientHeight 依赖(P5 黑屏修复)不受影响。 */
      top: var(--kb-h);
      right: 0;
      bottom: 0;
      padding: 4px 6px;
    }
    #terminal .xterm, #terminal .xterm-viewport { height: 100%; }
    /* 【滑动手感 · 为什么 CSS 这条路走不通】
       xterm 的 DOM 是 `.xterm > { .xterm-viewport(滚动容器), .xterm-screen(内容) }`
       —— 内容与滚动容器是**兄弟节点**。手指按内容时,浏览器沿祖先链向上找不到
       .xterm-viewport 这个可滚动元素,于是 touch-action: pan-y 给谁都落不到实处
       (上一轮那处 CSS 修复因此完全无效,已验证)。原生滚动这条路堵死,
       滚动只能由 JS 驱动 —— 所以这里保持 none:不让浏览器插手,
       全部交给下面脚本里"每帧一次 + 滑动期间暂停输出写入"的实现。 */
    #terminal, #terminal .xterm, #terminal .xterm-viewport,
    #terminal .xterm-screen, #terminal .xterm-rows {
      touch-action: none;
      overscroll-behavior: contain;
    }
    #terminal .xterm-viewport { scrollbar-width: none; }
    #terminal .xterm-viewport::-webkit-scrollbar { display: none; }
    /* ---- 【P1-7 终端辅助键栏】两行按键条,位于终端区上方(WebView 顶部,
       即 Compose 头部之下)。配色对齐编辑式石墨层(GraphiteDrawer #1B2634 /
       OnGraphiteHairline #364655 / CodeText #D5E6F8);粘滞 Ctrl 用编辑式主色
       #386BE7 点亮(主色只给当前操作),按下态整体提亮。 ---- */
    body.kb-off #keybar { display: none; }
    #keybar {
      position: absolute;
      left: 0;
      top: 0;
      right: 0;
      z-index: 10;
      padding: 4px 4px 2px;
      background: #1b2634;
      border-bottom: 1px solid #364655;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    .kb-row { display: flex; gap: 4px; }
    .kb-row + .kb-row { margin-top: 4px; }
    .kb-key {
      flex: 1;
      height: 44px; /* 触控目标:两行各 44px(README 主要点击区 ≥44px),
                       整栏高 99px(4+44+4+44+2+1 边框) */
      display: flex;
      align-items: center;
      justify-content: center;
      background: #243140;
      color: #d5e6f8;
      border: 1px solid #364655;
      border-radius: 8px;
      font: 600 13px/1 Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    .kb-key.kb-down { background: #31435a; border-color: #46596f; } /* 按下反馈 */
    .kb-key.kb-sticky { background: #386be7; border-color: #386be7; color: #ffffff; } /* Ctrl 粘滞点亮 */
    /* 键栏隐藏后的恢复浮钮:半透明小钮贴页面右上角,只在隐藏态出现 */
    #kbShow {
      display: none;
      position: absolute;
      top: 2px;
      right: 4px;
      z-index: 11;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      background: rgba(36, 49, 64, 0.85);
      color: #d5e6f8;
      border: 1px solid #364655;
      border-radius: 8px;
      font: 600 14px/1 Menlo, Consolas, monospace;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    body.kb-off #kbShow { display: flex; }
  </style>
</head>
<body>
  <!-- 【P1-7 终端辅助键栏】两行按键条,终端区上方(WebView 顶部 = Compose 头部之下)。
       Row1:Esc / Tab / Ctrl(粘滞) / ↑↓←→ / "-";
       Row2:常用 shell 符号 / | ~ $ 与 ^C ^D ^L 组合快捷键;末尾 ▾ 为收起钮。
       隐藏后由右上角浮钮 ▴ 恢复;显隐状态存 localStorage(键 pa.keybar.hidden)。 -->
  <div id="keybar">
    <div class="kb-row">
      <div class="kb-key" data-k="esc" role="button">Esc</div>
      <div class="kb-key" data-k="tab" role="button">Tab</div>
      <div class="kb-key" data-k="ctrl" role="button">Ctrl</div>
      <div class="kb-key" data-k="up" role="button">↑</div>
      <div class="kb-key" data-k="down" role="button">↓</div>
      <div class="kb-key" data-k="left" role="button">←</div>
      <div class="kb-key" data-k="right" role="button">→</div>
      <div class="kb-key" data-k="-" role="button">-</div>
    </div>
    <div class="kb-row">
      <div class="kb-key" data-k="/" role="button">/</div>
      <div class="kb-key" data-k="|" role="button">|</div>
      <div class="kb-key" data-k="~" role="button">~</div>
      <div class="kb-key" data-k="$" role="button">$</div>
      <div class="kb-key" data-k="^c" role="button">^C</div>
      <div class="kb-key" data-k="^d" role="button">^D</div>
      <div class="kb-key" data-k="^l" role="button">^L</div>
      <div class="kb-key" data-k="toggle" role="button">▾</div>
    </div>
  </div>
  <!-- 键栏隐藏后的恢复浮钮(半透明,贴右上角,不常驻) -->
  <div id="kbShow" role="button">▴</div>
  <div id="terminal"></div>
  <script>
    // 【竞态修复】gRPC 输出可能先于本页加载完成到达。
    // 先挂一个带缓冲的 termWrite,term 就绪后无缝切换为真实现并 flush。
    window._termQueue = [];
    // 【性能】JS 侧二次缓冲:跨进程调用(evaluateJavascript)本身就慢,
    // 每来一帧就 atob + write 会持续占用渲染线程。这里攒到下一个
    // requestAnimationFrame 再统一写,把 N 次 JS 处理压成 1 次,
    // 拖动滚动条时才不会被输出刷屏打断。
    window.termWrite = function (b64) { window._termQueue.push(b64); };
  </script>
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/xterm-addon-fit.js"></script>
  <script>
    (function () {
      var term = new Terminal({
        cursorBlink: true,
        fontSize: 13,
        fontFamily: 'Menlo, Consolas, "DejaVu Sans Mono", monospace',
        theme: {
          /* 石墨终端(编辑式 GraphiteCode #1A2430):内容区保持深色 xterm,
             前景取代码色 CodeText #D5E6F8,光标用编辑式主色(当前操作) */
          background: '#1a2430',
          foreground: '#d5e6f8',
          cursor: '#386be7',
          selectionBackground: '#2a4a73',
        },
        scrollback: 5000,
        convertEol: false,
        allowProposedApi: true,
      });

      term.open(document.getElementById('terminal'));
      var fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);

      // 【性能】写入队列 + rAF 合帧:一帧内的多次输出合并成一次 term.write。
      // 滚动时用户手指正占着主线程,减少 JS 侧工作量能明显改善跟手度。
      var _pending = [];
      var _rafQueued = false;
      // 【滑动手感的另一半】手指滑动期间**暂停输出写入**。
      // 卡顿的真身是两件事同时挤主线程:
      //   (1) xterm 自绑的 touchmove 每个事件都改一次 scrollTop(高刷屏一秒上百次),
      //       每次都触发一遍可见行重算;
      //   (2) 输出流的 atob + term.write 正好也在这一帧跑。
      // 单修哪一个都还是卡。这里让 (2) 在 (1) 期间让路:输出不丢,只是晚 100 多毫秒出来。
      var _scrollBusy = false;
      function _drain() {
        _rafQueued = false;
        if (!_pending.length) return;
        // 滑动中先不写;松手时由 __paScrollBusy(false) 重新排队
        if (_scrollBusy) return;
        var bin = atob(_pending.join(''));
        _pending.length = 0;
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        term.write(arr);
      }
      function _scheduleDrain() {
        if (!_rafQueued) { _rafQueued = true; requestAnimationFrame(_drain); }
      }
      window.termWrite = function (b64) {
        _pending.push(b64);
        _scheduleDrain();
      };
      // 滑动状态开关:由下面的触摸拦截器调用
      window.__paScrollBusy = function (busy) {
        var was = _scrollBusy;
        _scrollBusy = busy;
        if (was && !busy) _scheduleDrain();
      };
      // flush 竞态期间积压的输出
      while (window._termQueue.length) {
        window.termWrite(window._termQueue.shift());
      }

      // ---- 【滑动手感 · 关键修复】自己驱动滚动,每帧只写一次 scrollTop ----
      // 为什么必须自己来:CSS 的原生滚动方案在 xterm 的 DOM 结构下不可能生效
      // (见文件头 CSS 注释)。为什么原来的 xterm 原生处理会卡:它对**每个**
      // touchmove 都 `scrollTop += delta`,高刷屏一秒上百次,每次都要重算可见行;
      // 再叠加上并发的输出写入,主线程直接饱和 —— 真机表现就是"上下滑动严重卡顿"。
      //
      // 做法:捕获阶段拦下 touchmove(不让 xterm 处理),把位移累积起来,
      // 用 requestAnimationFrame **每帧只落一次** scrollTop;同时抬手/停下后
      // 延迟一小段再恢复输出写入,避免刚松手又被刷屏拖住。
      (function () {
        var vp = document.querySelector('.xterm-viewport');
        if (!vp) return;
        var lastY = 0, acc = 0, rafPending = false, idleTimer = null;
        // mode: null=尚未判定 / 'scroll'=接管(纵向快拖) / 'pass'=放行(横向、多指、长按)
        var mode = null, startX = 0, startY = 0, startT = 0;
        var THRESHOLD = 6;   // px:位移小于它不下结论,免得把"点一下"误判成拖动
        var LONGPRESS = 350; // ms:长按是 xterm 的选词手势,必须让路
        function apply() {
          rafPending = false;
          if (acc !== 0) { vp.scrollTop += acc; acc = 0; }
        }
        function markBusy() {
          if (window.__paScrollBusy) window.__paScrollBusy(true);
          if (idleTimer) clearTimeout(idleTimer);
          idleTimer = setTimeout(function () {
            // 补上最后一帧没落下的位移,再放行输出
            if (acc !== 0 && !rafPending) { rafPending = true; requestAnimationFrame(apply); }
            if (window.__paScrollBusy) window.__paScrollBusy(false);
          }, 140);
        }
        document.addEventListener('touchstart', function (ev) {
          if (ev.touches.length !== 1) { mode = 'pass'; return; }
          mode = null;
          startX = ev.touches[0].clientX;
          startY = ev.touches[0].clientY;
          startT = Date.now();
          lastY = startY;
          acc = 0;
        }, true);
        document.addEventListener('touchmove', function (ev) {
          if (mode === 'pass') return;
          if (ev.touches.length !== 1) { mode = 'pass'; return; }
          if (mode === null) {
            // 长按之后才开始移动 = 用户在拖选文字,交回 xterm,别抢
            if (Date.now() - startT > LONGPRESS) { mode = 'pass'; return; }
            var cx = ev.touches[0].clientX, cy = ev.touches[0].clientY;
            var dx = Math.abs(cx - startX), dy = Math.abs(cy - startY);
            if (dx < THRESHOLD && dy < THRESHOLD) return;
            mode = dy > dx ? 'scroll' : 'pass';
            if (mode === 'pass') return;
          }
          var y = ev.touches[0].clientY;
          acc += lastY - y;
          lastY = y;
          // 只 stopPropagation 挡住 xterm 那份"逐事件改 scrollTop"的实现;
          // 不 preventDefault —— 这里本来就没有原生滚动可取消。
          ev.stopPropagation();
          markBusy();
          if (!rafPending) { rafPending = true; requestAnimationFrame(apply); }
        }, true);
        document.addEventListener('touchend', function () { mode = null; }, true);
        document.addEventListener('touchcancel', function () {
          mode = null;
          if (window.__paScrollBusy) window.__paScrollBusy(false);
        }, true);
      })();

      // ---- 【P1-7 键栏 · Ctrl 粘滞态】共享状态与工具函数 ----
      // 定义在外层:软键盘路径(term.onData)和键栏路径(pressKey)共用同一份状态,
      // 无论从哪边消耗粘滞态,高亮都同步。
      var kbSticky = false;
      var kbCtrlBtn = document.querySelector('#keybar [data-k="ctrl"]');
      function kbSetSticky(on) {
        kbSticky = on;
        if (kbCtrlBtn) kbCtrlBtn.classList.toggle('kb-sticky', on);
      }
      // Ctrl+字符 → 控制字节。字母取标准 1..26;标点按"共享键位的位移形态"
      // 取值(与桌面终端/xterm 惯例一致):
      //   '-'(=_)/'/'(=?)→ 0x1F, '|'(=\)→ 0x1C, '~'(=^)→ 0x1E, '$'(=4)→ 0x04
      // 没有惯例映射的字符返回 -1,由调用方原样放行。
      function kbCtrlByte(ch) {
        var c = ch.charCodeAt(0);
        if (ch >= 'a' && ch <= 'z') return c - 96;
        if (ch >= 'A' && ch <= 'Z') return c - 64;
        if (ch === '-') return 0x1f;
        if (ch === '/') return 0x1f;
        if (ch === '|') return 0x1c;
        if (ch === '~') return 0x1e;
        if (ch === '$') return 0x04;
        return -1;
      }

      // 按键/粘贴输入 → Android 桥 → gRPC
      term.onData(function (data) {
        // 【P1-7】键栏点亮的粘滞 Ctrl 对软键盘输入同样生效:
        // 只改造"单个可打印 ASCII 字符"(软键盘单键击就是这种),
        // 粘贴/转义序列原样放行。改造后仍走 AndroidTerm.onKey 这唯一发送路径。
        if (kbSticky) {
          if (data.length === 1) {
            var code = data.charCodeAt(0);
            if (code >= 32 && code < 127) {
              var b = kbCtrlByte(data);
              if (b > 0) data = String.fromCharCode(b);
            }
          }
          kbSetSticky(false); // 任意后续输入都会消耗粘滞态
        }
        if (window.AndroidTerm) AndroidTerm.onKey(data);
      });

      // 【电脑键盘支持】蓝牙/OTG 外接键盘、以及部分输入法会派发 keydown,
      // 但 WebView 对某些键有自己的行为(焦点切换、返回历史),会先于 xterm
      // 把事件吃掉。这里在**捕获阶段**拦下这些键,直接按终端语义发给 PTY:
      //   Tab        → \t         (shell 补全,最高频)
      //   Shift+Tab  → ESC [ Z    (向后补全)
      //   Esc        → \x1b       (vim / less 退出)
      //   Backspace  → \x7f
      // 其余键(方向键/Home/End/Ctrl+字母)交给 xterm 自己的 keydown 处理,
      // 重复发送会让终端收到两次序列,所以这里刻意不碰。
      function sendSeq(seq) {
        if (window.AndroidTerm) AndroidTerm.onKey(seq);
      }
      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Tab') {
          ev.preventDefault();
          ev.stopPropagation();
          sendSeq(ev.shiftKey ? '\u001b[Z' : '\t');
          return;
        }
        // Esc:仅在没有修饰键时兜底(xterm 一般能处理,这里防输入法抢焦点)
        if (ev.key === 'Escape' && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
          ev.preventDefault();
          ev.stopPropagation();
          sendSeq('\u001b');
        }
      }, true);

      // ---- 【P1-7 终端辅助键栏】软键盘打不出的键:两行按键条 ----
      // 发送路径:全部复用上面的 sendSeq(AndroidTerm.onKey),不开第二条路。
      // 触控:touchstart 里 preventDefault —— 不产生合成 click、不转移焦点,
      // 因此点键不会唤起软键盘,也不干扰 xterm 输入区;桌面/RENDER-TEST 场景
      // 由 mousedown 兜底(touchstart 已 preventDefault,不会双发)。
      (function () {
        var bar = document.getElementById('keybar');
        var showBtn = document.getElementById('kbShow');
        if (!bar || !showBtn) return;
        var LS_KEY = 'pa.keybar.hidden';
        // 方向键 CSI 序列尾字母(VT 顺序:A上 B下 C右 D左)
        var ARROWS = { up: 'A', down: 'B', left: 'D', right: 'C' };
        // 直接发送的单键:Esc、Tab,以及组合快捷键 ^C/^D/^L(等价 Ctrl+C/D/L)
        var DIRECT = { esc: '\u001b', tab: '\t', '^c': '\u0003', '^d': '\u0004', '^l': '\u000c' };

        function pressKey(k) {
          if (k === 'ctrl') { kbSetSticky(!kbSticky); return; } // 粘滞开关,只点亮/熄灭,不发字节
          var seq = null;
          if (ARROWS[k]) {
            // 普通方向键 = CSI A/B/C/D;粘滞 Ctrl = CSI 1;5 A/B/C/D(修饰符参数 5=Ctrl)
            seq = kbSticky ? '\u001b[1;5' + ARROWS[k] : '\u001b[' + ARROWS[k];
          } else if (DIRECT[k]) {
            seq = DIRECT[k];
          } else if (k.length === 1) {
            if (kbSticky) {
              var b = kbCtrlByte(k);
              seq = b > 0 ? String.fromCharCode(b) : k;
            } else {
              seq = k;
            }
          }
          kbSetSticky(false); // Ctrl 以外的任何键都会消耗粘滞态(含 Esc/Tab)
          if (seq != null) sendSeq(seq);
        }

        function bindKey(el) {
          var k = el.getAttribute('data-k');
          el.addEventListener('touchstart', function (ev) {
            ev.preventDefault();
            el.classList.add('kb-down'); // 按下反馈,120ms 后自动撤掉
            setTimeout(function () { el.classList.remove('kb-down'); }, 120);
            pressKey(k);
          }, false);
          el.addEventListener('mousedown', function (ev) {
            ev.preventDefault(); // 防焦点转移
            pressKey(k);
          }, false);
        }
        var keyEls = bar.querySelectorAll('.kb-key');
        for (var i = 0; i < keyEls.length; i++) {
          // toggle(收起钮)有自己的监听,不走 pressKey
          if (keyEls[i].getAttribute('data-k') !== 'toggle') bindKey(keyEls[i]);
        }
        // 长按键不弹系统菜单/不进入选择
        bar.addEventListener('contextmenu', function (ev) { ev.preventDefault(); }, false);

        // 显隐:切 body class + 改 --kb-h 变量。#terminal top 随之变化,
        // 既有 ResizeObserver → fitAndReport 自动重跑 fit 并向 PTY 上报新行数。
        function applyVisibility(show) {
          document.body.classList.toggle('kb-off', !show);
          document.documentElement.style.setProperty(
            '--kb-h', show ? bar.offsetHeight + 'px' : '0px');
          try { localStorage.setItem(LS_KEY, show ? '0' : '1'); } catch (e) {}
          if (window.AndroidTerm) {
            AndroidTerm.report('KEYBAR ' + (show ? 'on h=' + bar.offsetHeight : 'off'));
          }
        }
        // Row2 末尾收起钮 → 隐藏;隐藏后右上角浮钮 → 恢复
        var toggleBtn = bar.querySelector('[data-k="toggle"]');
        function onToggle(ev) { ev.preventDefault(); applyVisibility(false); }
        function onShow(ev) { ev.preventDefault(); applyVisibility(true); }
        if (toggleBtn) {
          toggleBtn.addEventListener('touchstart', onToggle, false);
          toggleBtn.addEventListener('mousedown', onToggle, false);
        }
        showBtn.addEventListener('touchstart', onShow, false);
        showBtn.addEventListener('mousedown', onShow, false);

        // 状态存 localStorage,下次进页面保持用户的选择(存储不可用时默认显示)
        var saved = '0';
        try { saved = localStorage.getItem(LS_KEY) || '0'; } catch (e) {}
        applyVisibility(saved !== '1');
        // 页面自检:键栏初始化完成,真机 logcat(PaTerm tag)验证
        if (window.AndroidTerm) {
          AndroidTerm.report('KEYBAR-READY keys=' + keyEls.length + ' h=' + bar.offsetHeight);
        }
      })();


      // 【布局竞态修复】WebView 的 AndroidView 首次布局完成前 #terminal 高度≈0,
      // 过早 fit 会得到 1 行 0 高的终端(黑屏元凶)。用 ResizeObserver 等到
      // 容器有真实高度再做 fit;之后尺寸变化(旋转/分屏)自动跟随。
      var el = document.getElementById('terminal');
      var reported = false;
      if (window.AndroidTerm) AndroidTerm.report('BOOT h=' + el.clientHeight);
      function fitAndReport() {
        if (el.clientHeight < 80) {
          if (window.AndroidTerm) AndroidTerm.report('GUARD h=' + el.clientHeight);
          return;
        }
        try { fitAddon.fit(); } catch (e) {
          if (window.AndroidTerm) AndroidTerm.report('FIT-ERR ' + e);
          return;
        }
        // 【输入法可见性修复 · 关键】
        // 原来这里有一句 `if (reported) return;` —— 首次 fit 之后所有后续调用
        // 都在**上报之前**直接返回,于是 resize(cols,rows) 再也发不出去。
        // 键盘弹出 → WebView 因 adjustResize 变矮 → xterm 重排出更少的行,
        // 但电脑上的 PTY 仍然是旧行数:光标被算到可视区之外,
        // 输入的那行连同提示符一起"消失",看起来就是"输入框不可见"。
        // 现在把「首次上报」和「每次都要通知 resize」拆开:
        // 上报只做一次,resize 每次布局变化都必须发。
        if (!reported) {
          reported = true;
          try {
            var vp = document.querySelector('.xterm-viewport');
            var info = JSON.stringify({
              rows: term.rows, cols: term.cols,
              vpH: vp ? vp.clientHeight : -1,
              docH: document.documentElement.clientHeight,
            });
            if (window.AndroidTerm) AndroidTerm.report(info);
          } catch (e) {
            if (window.AndroidTerm) AndroidTerm.report('ERR ' + e);
          }
          if (window.AndroidTerm) AndroidTerm.ready();
        }
        // 每次尺寸变化都同步给 PTY,否则提示符会被画在可视区外
        if (window.AndroidTerm) AndroidTerm.resize(term.cols, term.rows);
        // 键盘遮挡时把最后一行滚回可见区(输入的那行必须在屏幕上)
        try { term.scrollToBottom(); } catch (e) {}
      }
      if (window.ResizeObserver) new ResizeObserver(fitAndReport).observe(el);
      setTimeout(fitAndReport, 300);
      setTimeout(fitAndReport, 1000);
      window.addEventListener('resize', fitAndReport);
      // 虚拟键盘弹出/收起会触发 visualViewport 变化,iOS/Android WebView 均支持
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', fitAndReport);
      }
    })();
  </script>
</body>
</html>
