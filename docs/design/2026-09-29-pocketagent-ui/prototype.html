const scenes=[['discovery','01 · 首页 / 连接匹配'],['home','02 · 首页 / 已连接'],['settings','03 · 设置'],['sessions','04 · 会话管理'],['chat','05 · 会话'],['drawer','06 · 侧边栏 / 展开'],['rail','07 · 侧边栏 / 收起'],['tasks','08 · 任务中心'],['files','09 · 文件管理'],['collab','10 · 多 Agent 协同'],['approval','11 · 审批弹窗'],['offline','12 · 离线恢复']];
const params=new URLSearchParams(location.search);const initial=params.get('screen')||'home';const state={page:scenes.some(s=>s[0]===initial)?initial:'home',connected:initial!=='discovery',drawer:initial==='drawer'?'expanded':initial==='rail'?'collapsed':null,collapsed:initial==='rail',modal:initial==='approval'?'approval':null,approved:false,rejected:false,paired:false,filter:'全部',taskTab:'消息',search:'',draft:'',collabDraft:'',agents:['Codex','Pi','DSH'],dispatched:false,folder:'项目一',toolOpen:false,running:true,offline:initial==='offline',toast:'',stack:[]};

const sessionData=[{name:'修复登录流程',agent:'Codex',status:'待处理',desc:'正在等待你确认命令执行',time:'刚刚',workspace:'项目一'},{name:'优化连接恢复体验',agent:'Codex',status:'进行中',desc:'检查断线后事件恢复与输入保留',time:'12 分钟前',workspace:'项目一'},{name:'整理验收报告',agent:'Pi',status:'已完成',desc:'报告与检查摘要已保存',time:'昨天 18:40',workspace:'项目一'},{name:'检查文件预览',agent:'DSH',status:'未完成',desc:'运行被中断，可从会话继续',time:'周一 16:28',workspace:'项目一'}];
function sessions(){const filtered=sessionData.filter(x=>(state.filter==='全部'||x.status===state.filter)&&(!state.search||x.name.includes(state.search)||x.agent.toLowerCase().includes(state.search.toLowerCase())));return `${navbar('会话',false,headerAction('plus','new','新建会话'))}<div class="content"><div class="search">${icon('search')}<input id="sessionSearch" placeholder="搜索会话或 Agent" value="${escapeHtml(state.search)}" aria-label="搜索会话"></div><div class="pills">${['全部','待处理','进行中','已完成','未完成'].map(x=>`<button class="pill ${state.filter===x?'sel':''}" data-filter="${x}">${x}</button>`).join('')}</div>${section('最近更新',`<small>${filtered.length} 个会话</small>`)}${filtered.length?filtered.map(x=>`<div class="session" data-action="chat"><div class="session-top">${brand(x.agent,true)}<span class="title">${x.name}</span>${stateBadge(x.status)}</div><p class="desc">${x.desc}</p><div class="session-foot"><span>${x.agent}</span><span>·</span><span>${x.workspace}</span><span>·</span><span>${x.time}</span></div></div>`).join(''):'<div class="empty-tip">没有符合条件的会话</div>'}<p class="screen-footnote">左滑可置顶或归档；长按查看更多管理操作。</p></div>`}

ta-action="send">${icon(state.running?'stop':'send',17)}</button></div></div>`}
function tasks(){return `${navbar('任务中心',false,headerAction('settings','settings','设置'))}<div class="content"><div class="stat-line"><div class="stat-box"><strong style="color:var(--amber)">${state.approved||state.rejected?'0':'1'}</strong><small>待你处理</small></div><div class="stat-box"><strong style="color:var(--mint)">2</strong><small>进行中</small></div><div class="stat-box"><strong>6</strong><small>已完成</small></div></div><div class="pills"><button class="pill ${state.taskTab==='消息'?'sel':''}" data-tasktab="消息">消息与审批</button><button class="pill ${state.taskTab==='下载'?'sel':''}" data-tasktab="下载">文件下载</button></div>${section(state.taskTab==='消息'?'需要关注':'最近下载')}${state.taskTab==='消息'?`${state.approved||state.rejected?'':`<div class="task-item"><span class="task-icon" style="color:var(--amber);background:var(--amber-dim)">${icon('shield')}</span><div class="task-main"><b>修复登录流程 · 等待审批</b><p>Codex 请求执行验证命令。仅本次授权，决定会回传原生 Agent。</p><footer><span>刚刚</span>${stateBadge('待处理')}<button data-action="approval">查看并处理 →</button></footer></div></div>`}<div class="task-item" data-action="chat"><span class="task-icon">${icon('spark')}</span><div class="task-main"><b>优化连接恢复体验</b><p>Codex 正在检查断线后事件恢复。</p><footer><span>12 分钟前</span>${stateBadge('进行中')}<button data-action="chat">打开会话 →</button></footer></div></div><div class="task-item"><span class="task-icon">${icon('check')}</span><div class="task-main"><b>整理验收报告已完成</b><p>报告与检查摘要已保存至工作区。</p><footer><span>昨天 18:40</span>${stateBadge('已完成')}</footer></div></div>`:`<div class="task-item" data-action="files"><span class="task-icon">${icon('download')}</span><div class="task-main"><b>验收报告.pdf</b><p>已保存到本机下载目录，可打开或前往用户数据管理。</p><footer><span>昨天 18:42</span>${stateBadge('已完成')}<button data-action="files">查看文件 →</button></footer></div></div>`}<p class="screen-footnote">打开任务中心后，已看见的消息角标清除；任务实际状态不受阅读影响。</p></div>`}
function files(){const root=state.folder==='项目一';return `${navbar('文件',false,headerAction('search','searchFiles','搜索文件'))}<div class="content"><div class="path-card"><b style="font-size:14px">${icon('monitor',16)} 工作站 / ${state.folder}</b><small>电脑工作区 · 已连接 · 按需加载</small></div><div class="breadcrumb"><span data-action="root">工作站</span>${icon('next',13)}<b data-action="root">项目一</b>${root?'':`${icon('next',13)}<b>${state.folder}</b>`}</div>${section(root?'工作区文件':'src 文件',`<small>${root?'6':'3'} 项</small>`)}${root?`<div class="file-row" data-action="folder"><span class="file-icon folder">${icon('folder')}</span><span class="row-text"><b>src</b><small>源代码 · 8 项</small></span><span class="chev">${icon('next')}</span></div><div class="file-row" data-action="folder"><span class="file-icon folder">${icon('folder')}</span><span class="row-text"><b>docs</b><small>文档 · 12 项</small></span><span class="chev">${icon('next')}</span></div><div class="file-row" data-action="preview"><span class="file-icon">${icon('file')}</span><span class="row-text"><b>README.md</b><small>Markdown · 18 KB · 今天 09:37</small></span><span class="chev">${icon('next')}</span></div><div class="file-row" data-action="preview"><span class="file-icon">${icon('file')}</span><span class="row-text"><b>验收报告.pdf</b><small>PDF · 2.4 MB · 昨天 18:42</small></span><span class="chev">${icon('next')}</span></div><div class="file-row" data-action="preview"><span class="file-icon">${icon('file')}</span><span class="row-text"><b>test-results.xlsx</b><small>表格 · 342 KB · 昨天 18:38</small></span><span class="chev">${icon('next')}</span></div>`:`${['AuthSession.kt','LoginViewModel.kt','SessionStore.kt'].map(x=>`<div class="file-row" data-action="preview"><span class="file-icon">${icon('file')}</span><span class="row-text"><b>${x}</b><small>Kotlin · 今天 09:40</small></span><span class="chev">${icon('next')}</span></div>`).join('')}`}<p class="screen-footnote">预览能力由文件类型决定；不支持内置预览时使用系统打开或保存。</p></div>`}
function collab(){return `${navbar('多 Agent 协同',true,headerAction('settings','settings','设置'))}<div class="content"><div class="collab-banner"><div class="branch">${icon('branch',21)}</div><h2>一条任务，多个视角。</h2><p>把同一指令并行交给选中的 Agent；每位参与者分别回报，不混为一条对话。</p></div>${section('参与协同',`<small>${state.agents.length} 位已选</small>`)}<div class="agent-select">${['Codex','Pi','DSH','ZCode'].map(x=>`<button class="agent-choice ${state.agents.includes(x)?'selected':''}" data-agent="${x}">${brand(x,true)}${x}</button>`).join('')}</div>${section(state.dispatched?'本次任务进度':'分工与状态','<button data-action="roles">配置角色 →</button>')}${['Codex','Pi','DSH'].filter(a=>state.agents.includes(a)).map((a,i)=>`<div class="collab-card"><header>${brand(a,true)}<b>${a}</b>${stateBadge(state.dispatched?(i===1?'已完成':'进行中'):'已就绪')}</header><p>${state.dispatched?['检查连接状态和恢复事件','检查界面提示与边界文案','复核变更与测试范围'][i]:['分析实现与风险','独立验证用户体验','复核代码与测试'][i]}</p></div>`).join('')}<p class="screen-footnote">仅可选当前主机声明支持协同的 Agent；并行失败不会中断其他参与者。</p></div><div class="collab-bottom"><textarea id="collabDraft" placeholder="描述需要协同完成的任务…">${escapeHtml(state.collabDraft)}</textarea><button class="primary block" data-action="dispatch">${state.dispatched?'查看各 Agent 结果':'派发给所选 Agent'}</button></div>`}
function offline(){return chat()}
function modal(){if(state.modal==='approval')return `<div class="modal-scrim" data-action="dismiss"><div class="modal" role="dialog" aria-modal="true" aria-label="审批请求"><div class="handle"></div><div class="modal-title"><span class="warn">${icon('shield',21)}</span><span><h2>确认执行命令</h2><small>来自 Codex · 修复登录流程</small></span></div><p>Agent 正在验证登录状态修复。请检查将执行的命令及工作范围，再决定是否允许。</p><div class="scope"><span>工作区</span><b>项目一</b></div><div class="scope"><span>操作类型</span><b>运行测试 · 本次有效</b></div><div class="codebox">./gradlew :app:testDebugUnitTest</div><div class="modal-actions"><button class="danger" data-action="reject">拒绝</button><button class="primary" data-action="approve">仅本次允许</button></div><p class="hint">关闭弹窗只会暂不处理，不会自动允许或拒绝。</p></div></div>`;if(state.modal==='pair')return `<div class="modal-scrim" data-action="dismiss"><div class="modal" role="dialog" aria-modal="true" aria-label="配对工作站"><div class="handle"></div><div class="modal-title"><span class="warn" style="color:var(--blue);background:var(--blue-dim)">${icon('monitor')}</span><span><h2>配对工作站</h2><small>核对电脑屏幕上的 8 位配对码</small></span></div><p>设备将建立独立身份。配对成功后，连接会自动恢复。</p><input id="pairCode" maxlength="8" inputmode="numeric" placeholder="输入 8 位配对码" style="width:100%;border:1px solid #456283;background:#0e151e;color:white;border-radius:12px;padding:14px;letter-spacing:5px;outline:0"><div class="modal-actions" style="margin-top:15px"><button class="secondary" data-action="dismiss">取消</button><button class="primary" data-action="completePair">完成配对</button></div><p class="hint">演示原型：任意 8 位数字可模拟完成配对。</p></div></div>`;if(state.modal==='preview')return `<div class="modal-scrim" data-action="dismiss"><div class="modal" role="dialog" aria-modal="true"><div class="handle"></div><div class="modal-title"><span class="warn" style="color:var(--blue);background:var(--blue-dim)">${icon('file')}</span><span><h2>文件预览</h2><small>工作站 / ${state.folder}</small></span></div><div class="codebox" style="min-height:145px">这是文件预览区域。正式应用按文件类型使用内置预览、系统打开或保存。</div><button class="secondary" style="width:100%" data-action="dismiss">返回文件列表</button></div></div>`;return ''}
function drawer(){if(!state.drawer)return '';const c=state.drawer==='collapsed';const links=[['grid','工作台','home'],['message','会话','sessions'],['tasks','任务中心','tasks'],['folder','文件','files'],['branch','多 Agent 协同','collab']];return `<div class="scrim" data-action="closeDrawer"></div><div class="drawer ${c?'collapsed':''}"><div class="drawer-head"><span class="brand logo">P</span>${c?'':`<span style="flex:1"><b>Pocket Agent</b><br><small>● 工作站已连接</small></span>`}<button class="icon-button plain" aria-label="${c?'展开侧边栏':'收起侧边栏'}" data-action="toggleDrawer">${icon(c?'expand':'collapse',17)}</button></div><div class="drawer-section">工作空间</div>${links.map(([i,t,to])=>`<button class="drawer-link ${state.page===to||((state.page==='drawer'||state.page==='rail')&&to==='home')?'active':''}" data-action="${to}" aria-label="${t}">${icon(i)}${c?'':`<span style="flex:1">${t}</span>`}${to==='tasks'&&!state.approved&&!state.rejected?'<span class="badge">1</span>':''}</button>`).join('')}<div class="drawer-spacer"></div><div class="drawer-foot"><button class="drawer-link" data-action="settings" aria-label="设置">${icon('settings')}${c?'':'<span>设置</span>'}</button><button class="drawer-link" data-action="discovery" aria-label="切换电脑">${icon('monitor')}${c?'':'<span>切换电脑</span>'}</button></div></div>`}
function render(){let p=state.page==='drawer'||state.page==='rail'?'home':state.page;let content=({discovery,home,settings,sessions,chat,tasks,files,collab,offline})[p]?.()||home();document.getElementById('app').innerHTML=statusbar()+content+`<div class="safe-area"></div>`+drawer()+modal()+(state.toast?`<div class="toast">${state.toast}</div>`:'');document.getElementById('sceneNav').innerHTML=`<strong>Pocket Agent · 界面重设</strong><small>12 张统一设计稿 · 点击切换场景<br>手机画面中的按钮也可以操作</small>`+scenes.map(([id,label])=>`<button class="${state.page===id?'active':''}" data-scene="${id}">${label}</button>`).join('');}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(page){if(state.page!==page)state.stack.push(state.page);state.page=page;state.drawer=null;state.modal=null;state.offline=page==='offline';render()}
function back(){if(state.modal){state.modal=null;render();return}if(state.drawer){state.drawer=null;if(state.page==='drawer'||state.page==='rail')state.page='home';render();return}if(state.page==='files'&&state.folder!=='项目一'){state.folder='项目一';render();return}if(state.page==='sessions'&&(state.search||state.filter!=='全部')){state.search='';state.filter='全部';render();return}state.page=state.stack.pop()||'home';state.offline=state.page==='offline';render()}
function notify(text){state.toast=text;render();setTimeout(()=>{state.toast='';render()},2100)}
document.addEventListener('input',e=>{if(e.target.id==='sessionSearch'){state.search=e.target.value;const pos=e.target.selectionStart;render();let n=document.getElementById('sessionSearch');n.focus();n.setSelectionRange(pos,pos)}if(e.target.id==='draft')state.draft=e.target.value;if(e.target.id==='collabDraft')state.collabDraft=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();back()}});
document.addEventListener('click',e=>{const n=e.target.closest('[data-scene],[data-action],[data-filter],[data-tasktab],[data-agent]');if(!n)return;if(n.dataset.scene){const scene=n.dataset.scene;state.page=scene;state.connected=scene!=='discovery';state.drawer=scene==='drawer'?'expanded':scene==='rail'?'collapsed':null;state.modal=scene==='approval'?'approval':null;state.offline=scene==='offline';state.approved=false;state.rejected=false;state.filter='全部';state.search='';render();return}if(n.dataset.filter){state.filter=n.dataset.filter;render();return}if(n.dataset.tasktab){state.taskTab=n.dataset.tasktab;render();return}if(n.dataset.agent){const a=n.dataset.agent;state.agents=state.agents.includes(a)?state.agents.filter(x=>x!==a):[...state.agents,a];render();return}const a=n.dataset.action;if(a==='dismiss'&&e.target.closest('.modal')&&e.target.dataset.action!=='dismiss')return;switch(a){case'back':back();break;case'drawer':state.drawer=state.collapsed?'collapsed':'expanded';render();break;case'closeDrawer':state.drawer=null;render();break;case'toggleDrawer':state.drawer=state.drawer==='collapsed'?'expanded':'collapsed';state.collapsed=state.drawer==='collapsed';render();break;case'approval':state.modal='approval';render();break;case'pair':case'manual':state.modal='pair';render();break;case'dismiss':state.modal=null;render();break;case'completePair':{const input=document.getElementById('pairCode');if(!/^\d{8}$/.test(input?.value||'')){input?.focus();notify('请输入电脑显示的 8 位配对码');return}state.connected=true;state.modal=null;go('home');break}case'approve':state.approved=true;state.modal=null;notify('已允许本次命令，正在同步');break;case'reject':state.rejected=true;state.modal=null;notify('已拒绝，Agent 将收到决定');break;case'tool':state.toolOpen=!state.toolOpen;render();break;case'send':if(state.running){state.running=false;notify('已请求停止当前执行')}else if(state.draft.trim()){state.draft='';state.running=true;notify('消息已送达')}else notify('先输入消息');break;case'dispatch':if(state.agents.length<2){notify('至少选择两位 Agent');break}if(!state.collabDraft.trim()&&!state.dispatched){notify('先输入共同指令');break}state.dispatched=true;notify('已派发给所选 Agent');break;case'folder':state.folder=state.folder==='项目一'?'src':'docs';render();break;case'root':state.folder='项目一';render();break;case'preview':state.modal='preview';render();break;case'reconnect':state.offline=false;go('chat');notify('连接已恢复，草稿仍在输入框');break;case'refresh':notify('已重新搜索附近主机');break;case'new':go('sessions');notify('选择 Agent 后开始新会话');break;case'attach':notify('选择本机文件或工作区文件');break;case'voice':notify('语音输入已准备');break;case'roles':notify('角色配置：按 Agent 分别设置');break;case'more':notify('会话操作：置顶、归档、复制链接');break;case'policy':case'appearance':case'agents':notify('二级设置在正式实现中展开');break;case'noop':break;default:if(scenes.some(x=>x[0]===a)){go(a)}else notify('该操作在设计原型中仅作展示')}});
render();
</script></body></html>
